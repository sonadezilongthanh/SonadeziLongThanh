<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bản đồ KCN Long Thành</title>
  <meta name="description" content="Bản đồ và tra cứu đơn vị KCN Long Thành – Sonadezi Long Thành">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json?v=5">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=5">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bản đồ KCN">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }

    /* ===== MÀN HÌNH KHỞI ĐỘNG: logo + vòng xoay (giống màn hình tải của app) ===== */
    #manHinhKhoiDong {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #fff; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: #5b6b7a;
      transition: opacity .35s ease;
    }
    #manHinhKhoiDong.an { opacity: 0; pointer-events: none; }
    /* Vòng xoay rộng 200px, logo nằm gọn bên trong, không bị che chữ */
    .khung-logo {
      position: relative; width: 200px; height: 200px;
      display: flex; align-items: center; justify-content: center;
    }
    .khung-logo .vong {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid rgba(11,70,150,.12); border-top-color: #0B4696;
      animation: xoayVong 1.6s linear infinite;      /* 1,6 giây / vòng */
    }
    .khung-logo img {
      position: relative; width: 112px; height: auto;
      animation: nhipLogo 2s ease-in-out infinite;
    }
    @keyframes xoayVong { to { transform: rotate(360deg); } }
    @keyframes nhipLogo { 0%,100% { transform: scale(1); } 50% { transform: scale(.94); } }

    #btnCaiDat {
      position: fixed; right: 16px; bottom: 16px; z-index: 10; display: none;
      padding: 10px 16px; border: 0; border-radius: 24px; cursor: pointer;
      background: #0b2a5b; color: #fff; font: 600 14px system-ui, sans-serif;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    #btnDong {
      margin-left: 8px; background: transparent; border: 0; color: #fff;
      font-size: 16px; cursor: pointer; padding: 0 2px;
    }
  </style>
</head>
<body>
  <div id="manHinhKhoiDong">
    <div class="khung-logo">
      <div class="vong"></div>
      <img src="icons/logo-tai.png?v=6" alt="Sonadezi Long Thành">
    </div>
    <div>Đang khởi động…</div>
  </div>

  <iframe id="khungApp"
    src="https://script.google.com/macros/s/AKfycbyD1ujseXrtEbNkpZz8FDA3BlcNqDS3oiF6F7N7QrwpZUt80zSzk-3ZrWjLACKj2BmH7w/exec"
    allow="clipboard-read; clipboard-write; geolocation; fullscreen"
    title="Bản đồ KCN Long Thành"></iframe>

  <button id="btnCaiDat">⬇ Cài đặt ứng dụng<span id="btnDong" title="Ẩn">✕</span></button>

  <script>
    // ===== Màn hình khởi động: hiện tối thiểu 1,8 giây VÀ đến khi app GAS tải xong =====
    var THOI_GIAN_TOI_THIEU = 1800;   // ms – chỉnh tại đây nếu muốn nhanh/chậm hơn
    var THOI_GIAN_TOI_DA    = 15000;  // ms – quá thời gian này thì ẩn luôn
    var batDau = Date.now();
    var manHinh = document.getElementById('manHinhKhoiDong');
    var daAn = false;
    function anManHinhKhoiDong() {
      if (daAn) return;
      daAn = true;
      var conLai = Math.max(0, THOI_GIAN_TOI_THIEU - (Date.now() - batDau));
      setTimeout(function () { manHinh.classList.add('an'); }, conLai + 300); // +0,3s chờ app vẽ xong
    }
    document.getElementById('khungApp').addEventListener('load', anManHinhKhoiDong);
    setTimeout(anManHinhKhoiDong, THOI_GIAN_TOI_DA);

    // ===== GIỮ ĐĂNG NHẬP: lưu phiên "Ghi nhớ đăng nhập" trên tên miền của vỏ PWA =====
    // App GAS chạy trong iframe nên bộ nhớ của app dễ bị mất; vỏ giữ hộ và trả lại khi mở app.
    var KHOA_PHIEN = 'SZL_VO_PHIEN', KHOA_TUY_CHON = 'SZL_VO_TUY_CHON';
    var khungApp = document.getElementById('khungApp');

    function docKhoa(k) {
      try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; }
    }
    function ghiKhoa(k, v) {
      try { if (v) localStorage.setItem(k, JSON.stringify(v)); else localStorage.removeItem(k); } catch (e) {}
    }
    function hanToken(t) {
      var p = String(t || '').split('.');
      return p.length === 3 ? (Number(p[1]) || 0) : 0;
    }
    // Chỉ nhận tin từ đúng iframe app của trang này
    function thuocKhungApp(w) {
      for (var i = 0; i < 5 && w; i++) {
        if (w === khungApp.contentWindow) return true;
        if (w === w.parent) return false;
        w = w.parent;
      }
      return false;
    }
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || d.szl !== true) return;
      if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin)) return;
      if (!thuocKhungApp(ev.source)) return;

      if (d.lenh === 'xin-phien') {
        var phien = docKhoa(KHOA_PHIEN);
        if (phien && hanToken(phien.token) <= Date.now()) { phien = null; ghiKhoa(KHOA_PHIEN, null); }
        var tc = docKhoa(KHOA_TUY_CHON) || {};
        ev.source.postMessage({ szl: 'phien', phien: phien, email: tc.email || '', chon: tc.chon || '' }, ev.origin);
      } else if (d.lenh === 'luu-phien' && d.phien && d.phien.token) {
        ghiKhoa(KHOA_PHIEN, { token: d.phien.token, email: d.phien.email, hoTen: d.phien.hoTen, vaiTro: d.phien.vaiTro });
      } else if (d.lenh === 'xoa-phien') {
        ghiKhoa(KHOA_PHIEN, null);
      } else if (d.lenh === 'luu-tuy-chon') {
        ghiKhoa(KHOA_TUY_CHON, { email: d.email, chon: d.chon });
      }
    });
    // Xin trình duyệt giữ bộ nhớ của app đã cài, tránh bị tự dọn khi máy thiếu dung lượng
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

    // ===== Service Worker – điều kiện bắt buộc để trình duyệt cho phép cài đặt =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    // ===== Nút "Cài đặt ứng dụng" =====
    var suKienCaiDat = null;
    var btn = document.getElementById('btnCaiDat');
    var daCaiDat = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      suKienCaiDat = e;
      if (!daCaiDat) btn.style.display = 'block';
    });
    btn.addEventListener('click', function (e) {
      if (e.target.id === 'btnDong') { btn.style.display = 'none'; return; }
      if (!suKienCaiDat) return;
      suKienCaiDat.prompt();
      suKienCaiDat.userChoice.finally(function () {
        suKienCaiDat = null;
        btn.style.display = 'none';
      });
    });
    window.addEventListener('appinstalled', function () { btn.style.display = 'none'; });
  </script>
</body>
</html>
