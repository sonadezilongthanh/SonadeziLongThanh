<!-- ══════════════════════════════════════════════════════════════════
     THẺ "GIỚI THIỆU KCN" — BỐ CỤC HỒ SƠ NĂNG LỰC, 3 NGÔN NGỮ (VI/EN/ZH)
     Nguồn dữ liệu : sheet DM_ThongTinKCN  (module ThongTinKCN.gs)
     Bố cục        : dải tiêu đề → dải số liệu nổi bật → thanh điều hướng
                     → lưới thẻ thông tin theo nhóm
     Kiểu hiển thị (cột KieuHienThi) quyết định cách kết xuất từng dòng:
        soLieu    → đưa lên dải số liệu nổi bật đầu trang
        chip      → viên thuốc nhỏ trong thẻ
        bieuTuong → dòng có biểu tượng, trị số in đậm
        theGia    → dòng đơn giá nổi bật
        bieuDo    → thanh ngang có cờ quốc gia
        phuDe     → dòng dẫn nhỏ
        ghiChu    → dòng ghi chú in nghiêng
        dong      → dòng "mục – giá trị", thu gọn trong "Xem chi tiết"
     Phòng Kinh doanh Tổng hợp — Sonadezi Long Thành
     ══════════════════════════════════════════════════════════════════ -->

<style>
.gt-boc { max-width: 1180px; margin: 0 auto; padding-bottom: 26px; }

/* ---------- Dải tiêu đề ---------- */
.gt-hero {
  background: linear-gradient(135deg, var(--xanh-dam), var(--xanh-nhat));
  color: #fff; padding: 20px 22px 18px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
}
.gt-hero .gt-nhan-tren { font-size: 10.5px; letter-spacing: 2px; opacity: .8; }
.gt-hero h2  { font-size: 22px; font-weight: 700; margin-top: 5px; line-height: 1.25; }
.gt-hero .gt-phu { font-size: 13px; opacity: .85; margin-top: 5px; }

.gt-ngonngu { display: flex; gap: 6px; flex-wrap: wrap; }
.gt-ngonngu button {
  border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12);
  color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 12.5px;
  cursor: pointer; white-space: nowrap;
}
.gt-ngonngu button.dang-chon { background: #fff; color: var(--xanh-dam); font-weight: 600; }

/* ---------- Dải số liệu nổi bật ---------- */
.gt-noi-bat {
  background: #f5f8fc; border-bottom: 1px solid var(--xam-vien);
  padding: 16px 22px; display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
}
.gt-noi-bat .so   { font-size: 25px; font-weight: 700; color: var(--xanh-dam); line-height: 1.1; }
.gt-noi-bat .nhan { font-size: 12px; color: var(--xam-chu); margin-top: 3px; }

/* ---------- Thanh điều hướng dính ---------- */
.gt-dieu-huong {
  position: sticky; top: 0; z-index: 20;
  background: var(--trang); border-bottom: 1px solid var(--xam-vien);
  display: flex; gap: 6px; padding: 9px 12px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.gt-dieu-huong::-webkit-scrollbar { display: none; }
.gt-dieu-huong button {
  border: 1px solid var(--xam-vien); background: var(--trang); color: var(--xam-chu);
  border-radius: 20px; padding: 6px 14px; font-size: 12.5px; white-space: nowrap; cursor: pointer;
}
.gt-dieu-huong button.dang-chon { background: var(--xanh-dam); border-color: var(--xanh-dam); color: #fff; }

/* ---------- Lưới thẻ thông tin ---------- */
.gt-luoi {
  display: grid; gap: 14px; padding: 18px 22px;
  grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
  align-items: start;
}
.gt-the {
  background: var(--trang); border: 1px solid var(--xam-vien);
  border-radius: 12px; box-shadow: var(--bong); overflow: hidden;
  scroll-margin-top: 58px;
}
.gt-the-dau {
  background: #eef3f8; padding: 11px 15px; border-bottom: 1px solid var(--xam-vien);
  font-size: 14px; font-weight: 600; color: var(--xanh-dam);
  display: flex; align-items: center; gap: 9px;
}
.gt-the-dau .ic { font-size: 17px; }
.gt-the-than { padding: 6px 15px 13px; }

/* Dòng thường trong thẻ */
.gt-dong { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed #e8edf2; font-size: 13px; }
.gt-dong:last-child { border-bottom: 0; }
.gt-dong .muc { flex: 0 0 46%; color: var(--xam-chu); }
.gt-dong .gt  { flex: 1; color: #1c2b36; font-weight: 500; }

/* Dòng biểu tượng */
.gt-bt { display: flex; align-items: flex-start; gap: 11px; padding: 9px 0; border-bottom: 1px dashed #e8edf2; }
.gt-bt:last-child { border-bottom: 0; }
.gt-bt .ic   { font-size: 19px; line-height: 1.2; flex: none; }
.gt-bt .tri  { font-size: 16px; font-weight: 700; color: #1c2b36; line-height: 1.2; }
.gt-bt .nhan { font-size: 12.5px; color: var(--xam-chu); margin-top: 2px; }

/* Dòng đơn giá */
.gt-gia {

}
.gt-gia .ten { font-size: 13px; font-weight: 600; color: #1c2b36; }
.gt-gia .so  { font-size: 21px; font-weight: 700; color: var(--xanh-dam); margin-top: 4px; line-height: 1.15; }
.gt-gia .dv  { font-size: 12px; color: var(--xam-chu); margin-top: 2px; }
.gt-gia .phu { font-size: 11.5px; color: var(--xam-chu); margin-top: 7px; line-height: 1.55; }

/* Chip nhỏ */
.gt-chip { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0 4px; }
.gt-chip span { background: #eef2f7; border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--xam-chu); }

/* Biểu đồ quốc tịch */
.gt-bieu-do { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 4px; }
.gt-bd-dong { display: flex; align-items: center; gap: 9px; }
.gt-bd-ten  { flex: 0 0 104px; display: flex; align-items: center; gap: 6px; justify-content: flex-end;
              font-size: 12px; color: var(--xam-chu); text-align: right; }
.gt-bd-co   { width: 18px; height: 13px; border-radius: 2px; object-fit: cover; flex: none; border: 1px solid rgba(0,0,0,.12); }
.gt-bd-rai  { flex: 1; background: #e9eef4; border-radius: 4px; overflow: hidden; height: 15px; }
.gt-bd-thanh{ height: 100%; background: var(--xanh-dam); border-radius: 4px; }
.gt-bd-so   { flex: 0 0 24px; font-size: 12px; font-weight: 600; color: #1c2b36; }

/* Dòng dẫn và ghi chú */
.gt-phu-de { font-size: 12.5px; color: var(--xam-chu); line-height: 1.6; margin: 8px 0 4px; }
.gt-ghi-chu { font-size: 11.5px; color: var(--xam-chu); font-style: italic; line-height: 1.55; margin-top: 9px; }

/* Khối chi tiết thu gọn */
.gt-chi-tiet { margin-top: 8px; }
.gt-chi-tiet summary {
  list-style: none; cursor: pointer; font-size: 12.5px;
  color: var(--xanh-dam); padding: 7px 0;
}
.gt-chi-tiet summary::-webkit-details-marker { display: none; }
.gt-chi-tiet summary::after { content: ' ▾'; }
.gt-chi-tiet[open] summary::after { content: ' ▴'; }

/* Chân trang */
.gt-chan { padding: 18px 22px 6px; text-align: center; }
.gt-thanh-nut { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.gt-lien-he { font-size: 12.5px; color: var(--xam-chu); margin-top: 13px; }
.gt-chan .gt-ghi-chu { text-align: center; }
.gt-trong { padding: 40px 20px; text-align: center; color: var(--xam-chu); }

@media (max-width: 640px) {
  .gt-hero { padding: 16px 14px; }
  .gt-hero h2 { font-size: 19px; }
  .gt-noi-bat { padding: 14px; }
  .gt-luoi { padding: 14px; }
  .gt-dong { flex-direction: column; gap: 2px; }
  .gt-dong .muc { flex: none; }
  .gt-bd-ten { flex: 0 0 92px; }
}

<script>
/***********************************************************************
 * THẺ GIỚI THIỆU KCN — BỐ CỤC HỒ SƠ NĂNG LỰC
 ***********************************************************************/
var TT_KCN      = null;
var TT_DANG_TAI = false;
var NN_KCN      = 'vi';
var SO_NOI_BAT  = 4;      // số ô tối đa trên dải số liệu đầu trang

/** Biểu tượng đầu mỗi thẻ, theo mã nhóm trong sheet */
var ICON_NHOM = {
  QUYMO   : '📐', VITRI : '📍', GIATHUE : '💵',
  HATANG  : '⚡', DAUTU : '🌏', KHAC    : 'ℹ️',
  CHUDAUTU: '🏢', QUYHOACH: '📐', NHAXUONG: '🏭', DATTHUE: '🗺️'
};

var NHAN_KCN = {
  vi: { tieuDe: 'KHU CÔNG NGHIỆP LONG THÀNH',
        phuDe : 'Thông tin tổng quan phục vụ giới thiệu khách hàng',
        pdf   : '📄 Hồ sơ KCN (PDF)',
        sao   : '📋 Sao chép nội dung',
        chiaSe: '📤 Chia sẻ',
        chiTiet: 'Xem chi tiết',
        tai   : 'Đang tải thông tin…',
        trong : 'Chưa có dữ liệu. Vui lòng chạy “Tạo/cập nhật sheet Giới thiệu KCN” trong bảng chọn ⚙ Hệ thống KCN.',
        ghiChu: 'Giá và phí chưa bao gồm thuế GTGT, có thể thay đổi theo quy định hiện hành.',
        daSao : '✓ Đã sao chép nội dung giới thiệu.' },
  en: { tieuDe: 'LONG THANH INDUSTRIAL ZONE',
        phuDe : 'Key features for customer presentation',
        pdf   : '📄 IZ Profile (PDF)',
        sao   : '📋 Copy content',
        chiaSe: '📤 Share',
        chiTiet: 'View details',
        tai   : 'Loading…',
        trong : 'No data available. Please run “Create/update Long Thanh IZ info sheet” from the ⚙ menu.',
        ghiChu: 'All charges exclude VAT and are subject to change under current regulations.',
        daSao : '✓ Content copied.' },
  zh: { tieuDe: '隆城工业区',
        phuDe : '客户介绍用综合信息',
        pdf   : '📄 工业区简介（PDF）',
        sao   : '📋 复制内容',
        chiaSe: '📤 分享',
        chiTiet: '查看详情',
        tai   : '正在加载…',
        trong : '暂无数据。请在 ⚙ 菜单中运行“创建/更新工业区介绍数据表”。',
        ghiChu: '以上价格及费用均不含增值税，并可能依现行规定调整。',
        daSao : '✓ 已复制内容。' }
};

/** Gọi khi mở thẻ Giới thiệu (từ chuyenTab) */
function renderGioiThieu() {
  if (TT_KCN) { veGioiThieu(); return; }
  if (TT_DANG_TAI) return;

  TT_DANG_TAI = true;
  document.getElementById('gtThan').innerHTML =
    '<div class="gt-trong">' + NHAN_KCN[NN_KCN].tai + '</div>';

  google.script.run
    .withSuccessHandler(function (kq) {
      TT_DANG_TAI = false;
      TT_KCN = kq || { dong: [], capNhat: '' };
      veGioiThieu();
    })
    .withFailureHandler(function (loi) {
      TT_DANG_TAI = false;
      document.getElementById('gtThan').innerHTML =
        '<div class="gt-trong">⚠ Lỗi tải thông tin: ' + (loi && loi.message ? loi.message : '') + '</div>';
    })
    .layThongTinKCN({ token: (typeof PHIEN_SUA !== 'undefined' ? PHIEN_SUA.token : '') });
}

function doiNgonNguKCN(nn) {
  if (!NHAN_KCN[nn]) return;
  NN_KCN = nn;
  Array.prototype.forEach.call(
    document.querySelectorAll('#gtNgonNgu button'),
    function (b) { b.classList.toggle('dang-chon', b.dataset.nn === nn); }
  );
  veGioiThieu();
}

function layTheoNN_(o) {
  if (!o) return '';
  return String(o[NN_KCN] || o.vi || o.en || '').trim();
}

function gtThoat_(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}


/***********************************************************************
 * KẾT XUẤT
 ***********************************************************************/
function veGioiThieu() {
  var nhan = NHAN_KCN[NN_KCN];
  document.getElementById('gtTieuDe').textContent     = nhan.tieuDe;
  document.getElementById('gtPhuDe').textContent      = nhan.phuDe;
  document.getElementById('gtNutSaoChep').textContent = nhan.sao;
  document.getElementById('gtNutChiaSe').textContent  = nhan.chiaSe;
  document.getElementById('gtGhiChu').textContent     = nhan.ghiChu;
  capNhatNutPDF_();

  var ds     = (TT_KCN && TT_KCN.dong) ? TT_KCN.dong : [];
  var elThan = document.getElementById('gtThan');
  var elNav  = document.getElementById('gtDieuHuong');
  var elNB   = document.getElementById('gtNoiBat');

  if (!ds.length) {
    elNav.classList.add('an');
    elNB.classList.add('an');
    elThan.innerHTML = '<div class="gt-trong">' + nhan.trong + '</div>';
    return;
  }

  /* --- Dải số liệu nổi bật --- */
  var noiBat = ds.filter(function (d) { return d.noiBat; }).slice(0, SO_NOI_BAT);
  if (noiBat.length) {
    elNB.classList.remove('an');
    elNB.innerHTML = noiBat.map(function (d) {
      return '<div><div class="so">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
           + '<div class="nhan">' + gtThoat_(layTheoNN_(d.muc)) + '</div></div>';
    }).join('');
  } else {
    elNB.classList.add('an');
  }

  /* --- Gom theo nhóm, giữ nguyên thứ tự xuất hiện --- */
  var thuTu = [], nhomMap = {};
  ds.forEach(function (d) {
    var ma = d.maNhom || 'KHAC';
    if (!nhomMap[ma]) { nhomMap[ma] = { ten: layTheoNN_(d.nhom), dong: [] }; thuTu.push(ma); }
    nhomMap[ma].dong.push(d);
  });

  /* --- Thanh điều hướng --- */
  elNav.classList.remove('an');
  elNav.innerHTML = thuTu.map(function (ma, i) {
    return '<button type="button" data-the="gtThe-' + ma + '"' + (i === 0 ? ' class="dang-chon"' : '') + '>'
         + gtThoat_(nhomMap[ma].ten) + '</button>';
  }).join('');
  Array.prototype.forEach.call(elNav.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () { nhayToiThe_(b); });
  });

  /* --- Lưới thẻ --- */
  elThan.innerHTML = '<div class="gt-luoi">' + thuTu.map(function (ma) {
    var n    = nhomMap[ma];
    var than = veThanThe_(n.dong);
    if (!than) return '';
    return '<div class="gt-the" id="gtThe-' + ma + '">'
         + '<div class="gt-the-dau"><span class="ic">' + (ICON_NHOM[ma] || 'ℹ️') + '</span>'
         + gtThoat_(n.ten) + '</div>'
         + '<div class="gt-the-than">' + than + '</div></div>';
  }).join('') + '</div>';
}

/** Thân một thẻ: gom các dòng liền nhau cùng kiểu thành từng khối */
function veThanThe_(dong) {
  var khoi = [], hienTai = null;
  dong.forEach(function (d) {
    // Dòng đã lên dải số liệu đầu trang thì không lặp lại trong thẻ
    if (d.kieu === 'soLieu' && d.noiBat) return;
    var k = (d.kieu === 'soLieu') ? 'dong' : (d.kieu || 'dong');
    if (!hienTai || hienTai.kieu !== k) { hienTai = { kieu: k, ds: [] }; khoi.push(hienTai); }
    hienTai.ds.push(d);
  });

  return khoi.map(function (k) {
    if (k.kieu === 'chip')      return veChip_(k.ds);
    if (k.kieu === 'bieuTuong') return veBieuTuong_(k.ds);
    if (k.kieu === 'theGia')    return veTheGia_(k.ds);
    if (k.kieu === 'bieuDo')    return veBieuDo_(k.ds);
    if (k.kieu === 'phuDe')     return vePhuDe_(k.ds);
    if (k.kieu === 'ghiChu')    return veGhiChu_(k.ds);
    return veChiTiet_(k.ds);
  }).join('');
}

function veChip_(ds) {
  return '<div class="gt-chip">' + ds.map(function (d) {
    return '<span>' + gtThoat_(layTheoNN_(d.muc)) + ' ' + gtThoat_(layTheoNN_(d.giaTri)) + '</span>';
  }).join('') + '</div>';
}

function veBieuTuong_(ds) {
  return ds.map(function (d) {
    var nhan = layTheoNN_(d.muc);
    var phu  = layTheoNN_(d.phu);
    return '<div class="gt-bt">'
         + (d.icon ? '<span class="ic">' + gtThoat_(d.icon) + '</span>' : '')
         + '<div><div class="tri">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + (nhan ? '<div class="nhan">' + gtThoat_(nhan) + '</div>' : '')
         + (phu  ? '<div class="phu">'  + gtThoat_(phu)  + '</div>' : '')
         + '</div></div>';
  }).join('');
}

/** Dòng đơn giá: phụ chú tách hai phần bằng dấu || (đơn vị || ghi chú) */
function veTheGia_(ds) {
  return ds.map(function (d) {
    var phu = layTheoNN_(d.phu).split('||');
    return '<div class="gt-gia">'
         + '<div class="ten">' + (d.icon ? gtThoat_(d.icon) + ' ' : '') + gtThoat_(layTheoNN_(d.muc)) + '</div>'
         + '<div class="so">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + (phu[0] ? '<div class="dv">'  + gtThoat_(phu[0].trim()) + '</div>' : '')
         + (phu[1] ? '<div class="phu">' + gtThoat_(phu[1].trim()) + '</div>' : '')
         + '</div>';
  }).join('');
}

/** Biểu đồ thanh ngang, cờ quốc gia lấy theo cột MaCo */
function veBieuDo_(ds) {
  var soCua = function (d) {
    var n = parseFloat(String(layTheoNN_(d.giaTri)).replace(/[^0-9.,]/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  };
  var lonNhat = 0;
  ds.forEach(function (d) { lonNhat = Math.max(lonNhat, soCua(d)); });
  if (!lonNhat) lonNhat = 1;

  return '<div class="gt-bieu-do">' + ds.map(function (d) {
    var pt = Math.max(3, Math.round(soCua(d) / lonNhat * 100));
    var co = d.maCo
      ? '<img class="gt-bd-co" alt="" loading="lazy" src="https://flagcdn.com/40x30/' + gtThoat_(d.maCo) + '.png" '
        + 'onerror="this.style.display=\'none\'">'
      : '';
    return '<div class="gt-bd-dong">'
         + '<div class="gt-bd-ten">' + co + '<span>' + gtThoat_(layTheoNN_(d.muc)) + '</span></div>'
         + '<div class="gt-bd-rai"><div class="gt-bd-thanh" style="width:' + pt + '%"></div></div>'
         + '<div class="gt-bd-so">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + '</div>';
  }).join('') + '</div>';
}

function vePhuDe_(ds) {
  return ds.map(function (d) {
    return '<div class="gt-phu-de">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>';
  }).join('');
}

function veGhiChu_(ds) {
  return ds.map(function (d) {
    return '<div class="gt-ghi-chu">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>';
  }).join('');
}

/** Dòng chi tiết — thu gọn để thẻ không bị dày chữ */
function veChiTiet_(ds) {
  return '<details class="gt-chi-tiet"><summary>' + NHAN_KCN[NN_KCN].chiTiet + '</summary>'
       + ds.map(function (d) {
           return '<div class="gt-dong">'
                + '<div class="muc">' + (d.icon ? gtThoat_(d.icon) + ' ' : '') + gtThoat_(layTheoNN_(d.muc)) + '</div>'
                + '<div class="gt">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div></div>';
         }).join('')
       + '</details>';
}

/** Cuộn tới thẻ tương ứng và làm nổi bật nút trên thanh điều hướng */
function nhayToiThe_(nut) {
  var el = document.getElementById(nut.dataset.the);
  if (!el) return;
  Array.prototype.forEach.call(
    document.querySelectorAll('#gtDieuHuong button'),
    function (b) { b.classList.toggle('dang-chon', b === nut); }
  );
  try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  catch (e) { el.scrollIntoView(); }
}


/***********************************************************************
 * HỒ SƠ PDF · SAO CHÉP · CHIA SẺ
 ***********************************************************************/
function layLinkHoSoKCN_() {
  var ch = (typeof DU_LIEU !== 'undefined' && DU_LIEU && DU_LIEU.cauHinh) ? DU_LIEU.cauHinh : {};
  return String(ch['LinkHoSoKCN_' + NN_KCN.toUpperCase()] || ch.LinkHoSoKCN || '').trim();
}

function capNhatNutPDF_() {
  var nut  = document.getElementById('gtNutPDF');
  var link = layLinkHoSoKCN_();
  if (!nut) return;
  if (link) {
    nut.style.display = '';
    nut.textContent   = NHAN_KCN[NN_KCN].pdf;
    nut.onclick = function () { window.open(link, '_blank'); };
  } else {
    nut.style.display = 'none';
  }
}

function noiDungGioiThieuVanBan_() {
  var ds  = (TT_KCN && TT_KCN.dong) ? TT_KCN.dong : [];
  var out = [NHAN_KCN[NN_KCN].tieuDe, ''];
  var nhomHienTai = '';

  ds.forEach(function (d) {
    if (d.kieu === 'bieuDo') return;                 // bỏ danh sách quốc tịch cho gọn tin nhắn
    var ten = layTheoNN_(d.nhom);
    if (ten && ten !== nhomHienTai) { nhomHienTai = ten; out.push('— ' + ten.toUpperCase() + ' —'); }
    var muc = layTheoNN_(d.muc);
    out.push('• ' + (muc ? muc + ': ' : '') + layTheoNN_(d.giaTri));
  });

  var link = layLinkHoSoKCN_();
  if (link) out.push('', '📄 ' + link);
  out.push('', 'Sonadezi Long Thanh Shareholding Company', '☎ 84-251-3514494 | ✉ longthanhiz@szl.com.vn');
  return out.join('\n');
}

function saoChepGioiThieu() {
  var vb = noiDungGioiThieuVanBan_();
  var xong = function () { alert(NHAN_KCN[NN_KCN].daSao); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(vb).then(xong, function () { saoChepDuPhong_(vb, xong); });
  } else {
    saoChepDuPhong_(vb, xong);
  }
}

function saoChepDuPhong_(vb, xong) {
  var o = document.createElement('textarea');
  o.value = vb;
  o.style.position = 'fixed'; o.style.opacity = '0';
  document.body.appendChild(o);
  o.select();
  try { document.execCommand('copy'); xong(); } catch (e) { alert(vb); }
  document.body.removeChild(o);
}

function chiaSeGioiThieu() {
  var vb = noiDungGioiThieuVanBan_();
  if (navigator.share) navigator.share({ title: NHAN_KCN[NN_KCN].tieuDe, text: vb }).catch(function () {});
  else saoChepGioiThieu();
}

/* ----- Gắn sự kiện ----- */
(function () {
  var oNN = document.getElementById('gtNgonNgu');
  if (oNN) {
    Array.prototype.forEach.call(oNN.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { doiNgonNguKCN(b.dataset.nn); });
    });
  }
  var bSao = document.getElementById('gtNutSaoChep');
  if (bSao) bSao.addEventListener('click', saoChepGioiThieu);
  var bChiaSe = document.getElementById('gtNutChiaSe');
  if (bChiaSe) bChiaSe.addEventListener('click', chiaSeGioiThieu);
})();
</script>
