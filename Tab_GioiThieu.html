     THẺ "GIỚI THIỆU KCN" — BỐ CỤC TRÌNH CHIẾU, 3 NGÔN NGỮ (VI/EN/ZH)
     Nguồn dữ liệu : sheet DM_ThongTinKCN  (module ThongTinKCN.gs)
     Kiểu hiển thị : cột KieuHienThi quyết định cách kết xuất từng dòng
        soLieu    → số liệu cỡ lớn
        bieuTuong → biểu tượng + trị số (khoảng cách, công suất)
        theGia    → thẻ đơn giá
        bieuDo    → thanh ngang (quốc tịch nhà đầu tư, có cờ)
        ghiChu    → dòng ghi chú in nghiêng
        dong      → dòng "mục – giá trị" (mặc định)

<style>
.gt-boc { max-width: 980px; margin: 0 auto; padding-bottom: 24px; }

/* ---------- Dải tiêu đề ---------- */
.gt-hero {
  background: linear-gradient(135deg, var(--xanh-dam), var(--xanh-nhat));
  color: #fff; text-align: center; padding: 34px 20px 28px;
}
.gt-hero .gt-nhan-tren { font-size: 11px; letter-spacing: 2.4px; opacity: .8; }
.gt-hero h2 { font-size: 30px; font-weight: 700; line-height: 1.25; margin-top: 8px; }
.gt-hero .gt-phu { font-size: 14px; opacity: .85; margin-top: 10px; }

.gt-ngonngu { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.gt-ngonngu button {
  border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12);
  color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
}
.gt-ngonngu button.dang-chon { background: #fff; color: var(--xanh-dam); font-weight: 600; }

/* ---------- Thanh điều hướng dính ---------- */
.gt-dieu-huong {
  position: sticky; top: 0; z-index: 20;
  background: var(--trang); border-bottom: 1px solid var(--xam-vien);
  display: flex; gap: 6px; padding: 9px 12px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.gt-dieu-huong::-webkit-scrollbar { display: none; }
.gt-dieu-huong button {
  border: 1px solid var(--xam-vien); background: var(--trang); color: var(--xam-chu);
  border-radius: 20px; padding: 6px 14px; font-size: 13px; white-space: nowrap; cursor: pointer;
}
.gt-dieu-huong button.dang-chon { background: var(--xanh-dam); border-color: var(--xanh-dam); color: #fff; }

/* ---------- Khối nội dung ---------- */
.gt-phan { padding: 30px 20px; border-bottom: 1px solid var(--xam-vien); scroll-margin-top: 56px; }
.gt-phan:nth-child(odd)  { background: var(--trang); }
.gt-phan:nth-child(even) { background: #f7f9fc; }
.gt-phan-ten {
  text-align: center; font-size: 11px; letter-spacing: 2.2px;
  color: var(--xam-chu); text-transform: uppercase; margin-bottom: 20px;
}

/* Số liệu lớn */
.gt-so-lon { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); text-align: center; }
.gt-so-lon .so   { font-size: 34px; font-weight: 700; color: var(--xanh-dam); line-height: 1; }
.gt-so-lon .nhan { font-size: 13px; color: var(--xam-chu); margin-top: 6px; }

/* Biểu tượng + trị số */
.gt-bieu-tuong { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); text-align: center; }
.gt-bieu-tuong .ic   { font-size: 26px; line-height: 1; }
.gt-bieu-tuong .tri  { font-size: 20px; font-weight: 700; color: #1c2b36; margin-top: 8px; }
.gt-bieu-tuong .nhan { font-size: 12px; color: var(--xam-chu); margin-top: 2px; }

/* Thẻ đơn giá */
.gt-the-gia { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.gt-the-gia .the {
  border: 1px solid var(--xam-vien); border-radius: 12px; background: var(--trang);
  padding: 18px 16px; text-align: center; box-shadow: var(--bong);
}
.gt-the-gia .ic   { font-size: 24px; }
.gt-the-gia .ten  { font-size: 14px; font-weight: 600; color: #1c2b36; margin-top: 8px; }
.gt-the-gia .gia  { font-size: 25px; font-weight: 700; color: var(--xanh-dam); margin-top: 10px; line-height: 1.15; }

/* Biểu đồ quốc tịch */
.gt-bieu-do { display: flex; flex-direction: column; gap: 9px; max-width: 620px; margin: 0 auto; }
.gt-bd-dong { display: flex; align-items: center; gap: 10px; }
.gt-bd-ten  { flex: 0 0 132px; display: flex; align-items: center; gap: 7px; justify-content: flex-end;
              font-size: 12.5px; color: var(--xam-chu); text-align: right; }
.gt-bd-co   { width: 20px; height: 15px; border-radius: 2px; object-fit: cover; flex: none; border: 1px solid rgba(0,0,0,.12); }
.gt-bd-rai  { flex: 1; background: #e9eef4; border-radius: 4px; overflow: hidden; height: 17px; }
.gt-bd-thanh{ height: 100%; background: var(--xanh-dam); border-radius: 4px; }
.gt-bd-so   { flex: 0 0 26px; font-size: 12.5px; font-weight: 600; color: #1c2b36; }

/* Dòng mục – giá trị */
.gt-luoi-dong { display: grid; gap: 0 26px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); max-width: 820px; margin: 0 auto; }
.gt-dong { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px dashed #e2e8ef; font-size: 13.5px; }
.gt-dong .muc { flex: 0 0 45%; color: var(--xam-chu); }
.gt-dong .gt  { flex: 1; color: #1c2b36; font-weight: 500; }

/* Chip phụ dưới số liệu */
.gt-chip { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.gt-chip span { background: #eef2f7; border-radius: 20px; padding: 6px 14px; font-size: 12.5px; color: var(--xam-chu); }

/* Dòng phụ đề nhỏ giữa phần */
.gt-phu-de { text-align: center; font-size: 12.5px; color: var(--xam-chu); margin-top: 16px; line-height: 1.6; }
.gt-phu-de.tren { margin: -8px 0 18px; }

/* Phụ chú dưới biểu tượng và trong thẻ giá */
.gt-bieu-tuong .phu { font-size: 11.5px; color: var(--xam-chu); margin-top: 4px; line-height: 1.5; }
.gt-the-gia .dv  { font-size: 12px; color: var(--xam-chu); margin-top: 4px; }
.gt-the-gia .phu { font-size: 12px; color: var(--xam-chu); margin-top: 10px; line-height: 1.55; }

/* Khối chi tiết thu gọn */
.gt-chi-tiet { max-width: 820px; margin: 18px auto 0; }
.gt-chi-tiet summary {
  list-style: none; cursor: pointer; text-align: center;
  font-size: 12.5px; color: var(--xanh-dam); padding: 7px 0;
}
.gt-chi-tiet summary::-webkit-details-marker { display: none; }
.gt-chi-tiet summary::after { content: ' ▾'; }
.gt-chi-tiet[open] summary::after { content: ' ▴'; }

.gt-ghi-chu { text-align: center; font-size: 12.5px; color: var(--xam-chu); font-style: italic; margin-top: 14px; }
.gt-cach    { height: 18px; }

/* Chân trang */
.gt-chan { padding: 24px 20px; text-align: center; background: var(--trang); }
.gt-thanh-nut { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.gt-lien-he { font-size: 12.5px; color: var(--xam-chu); margin-top: 14px; }
.gt-trong { padding: 40px 20px; text-align: center; color: var(--xam-chu); }

@media (max-width: 640px) {
  .gt-hero h2 { font-size: 24px; }
  .gt-so-lon .so { font-size: 28px; }
  .gt-phan { padding: 24px 14px; }
  .gt-dong { flex-direction: column; gap: 2px; }
  .gt-dong .muc { flex: none; }
  .gt-bd-ten { flex: 0 0 108px; font-size: 12px; }
}
</style>

<script>
/***********************************************************************
 * THẺ GIỚI THIỆU KCN — BỐ CỤC TRÌNH CHIẾU
 ***********************************************************************/
var TT_KCN      = null;
var TT_DANG_TAI = false;
var NN_KCN      = 'vi';

var NHAN_KCN = {
  vi: { tieuDe: 'KHU CÔNG NGHIỆP LONG THÀNH',
        phuDe : 'Thông tin tổng quan phục vụ giới thiệu khách hàng',
        pdf   : '📄 Hồ sơ KCN (PDF)',
        sao   : '📋 Sao chép nội dung',
        chiaSe: '📤 Chia sẻ',
        tai   : 'Đang tải thông tin…',
        trong : 'Chưa có dữ liệu. Vui lòng chạy “Tạo/cập nhật sheet Giới thiệu KCN” trong bảng chọn ⚙ Hệ thống KCN.',
        ghiChu: 'Giá và phí chưa bao gồm thuế GTGT, có thể thay đổi theo quy định hiện hành.',
        daSao : '✓ Đã sao chép nội dung giới thiệu.' },
  en: { tieuDe: 'LONG THANH INDUSTRIAL ZONE',
        phuDe : 'Key features for customer presentation',
        pdf   : '📄 IZ Profile (PDF)',
        sao   : '📋 Copy content',
        chiaSe: '📤 Share',
        tai   : 'Loading…',
        trong : 'No data available. Please run “Create/update Long Thanh IZ info sheet” from the ⚙ menu.',
        ghiChu: 'All charges exclude VAT and are subject to change under current regulations.',
        daSao : '✓ Content copied.' },
  zh: { tieuDe: '隆城工业区',
        phuDe : '客户介绍用综合信息',
        pdf   : '📄 工业区简介（PDF）',
        sao   : '📋 复制内容',
        chiaSe: '📤 分享',
        tai   : '正在加载…',
        trong : '暂无数据。请在 ⚙ 菜单中运行“创建/更新工业区介绍数据表”。',
        ghiChu: '以上价格及费用均不含增值税，并可能依现行规定调整。',
        daSao : '✓ 已复制内容。' }
};

/** Gọi khi mở thẻ Giới thiệu (từ chuyenTab) */
function renderGioiThieu() {
  if (TT_KCN) { veGioiThieu(); return; }
  if (TT_DANG_TAI) return;

  TT_DANG_TAI = true;
  document.getElementById('gtThan').innerHTML =
    '<div class="gt-trong">' + NHAN_KCN[NN_KCN].tai + '</div>';

  google.script.run
    .withSuccessHandler(function (kq) {
      TT_DANG_TAI = false;
      TT_KCN = kq || { dong: [], capNhat: '' };
      veGioiThieu();
    })
    .withFailureHandler(function (loi) {
      TT_DANG_TAI = false;
      document.getElementById('gtThan').innerHTML =
        '<div class="gt-trong">⚠ Lỗi tải thông tin: ' + (loi && loi.message ? loi.message : '') + '</div>';
    })
    .layThongTinKCN({ token: (typeof PHIEN_SUA !== 'undefined' ? PHIEN_SUA.token : '') });
}

function doiNgonNguKCN(nn) {
  if (!NHAN_KCN[nn]) return;
  NN_KCN = nn;
  Array.prototype.forEach.call(
    document.querySelectorAll('#gtNgonNgu button'),
    function (b) { b.classList.toggle('dang-chon', b.dataset.nn === nn); }
  );
  veGioiThieu();
}

function layTheoNN_(o) {
  if (!o) return '';
  return String(o[NN_KCN] || o.vi || o.en || '').trim();
}

function gtThoat_(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/***********************************************************************
 * KẾT XUẤT
 ***********************************************************************/
function veGioiThieu() {
  var nhan = NHAN_KCN[NN_KCN];
  document.getElementById('gtTieuDe').textContent      = nhan.tieuDe;
  document.getElementById('gtPhuDe').textContent       = nhan.phuDe;
  document.getElementById('gtNutSaoChep').textContent  = nhan.sao;
  document.getElementById('gtNutChiaSe').textContent   = nhan.chiaSe;
  document.getElementById('gtGhiChu').textContent      = nhan.ghiChu;
  capNhatNutPDF_();

  var ds = (TT_KCN && TT_KCN.dong) ? TT_KCN.dong : [];
  var elThan = document.getElementById('gtThan');
  var elNav  = document.getElementById('gtDieuHuong');

  if (!ds.length) {
    elNav.classList.add('an');
    elThan.innerHTML = '<div class="gt-trong">' + nhan.trong + '</div>';
    return;
  }

  /* --- Gom theo nhóm, giữ nguyên thứ tự xuất hiện --- */
  var thuTu = [], nhomMap = {};
  ds.forEach(function (d) {
    var ma = d.maNhom || 'KHAC';
    if (!nhomMap[ma]) { nhomMap[ma] = { ten: layTheoNN_(d.nhom), dong: [] }; thuTu.push(ma); }
    nhomMap[ma].dong.push(d);
  });

  /* --- Thanh điều hướng --- */
  elNav.classList.remove('an');
  elNav.innerHTML = thuTu.map(function (ma, i) {
    return '<button type="button" data-phan="gtPhan-' + ma + '"' + (i === 0 ? ' class="dang-chon"' : '') + '>'
         + gtThoat_(nhomMap[ma].ten) + '</button>';
  }).join('');
  Array.prototype.forEach.call(elNav.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () { nhayToiPhan_(b); });
  });

  /* --- Thân trang --- */
  elThan.innerHTML = thuTu.map(function (ma) {
    var n = nhomMap[ma];
    return '<div class="gt-phan" id="gtPhan-' + ma + '">'
         + '<div class="gt-phan-ten">' + gtThoat_(n.ten) + '</div>'
         + veNhom_(n.dong)
         + '</div>';
  }).join('');
}

/** Kết xuất một nhóm: gom các dòng liền nhau cùng kiểu thành từng khối */
function veNhom_(dong) {
  var khoi = [], hienTai = null;
  dong.forEach(function (d) {
    var k = d.kieu || 'dong';
    if (!hienTai || hienTai.kieu !== k) { hienTai = { kieu: k, ds: [] }; khoi.push(hienTai); }
    hienTai.ds.push(d);
  });

  return khoi.map(function (k, i) {
    var cach = i > 0 ? '<div class="gt-cach"></div>' : '';
    if (k.kieu === 'soLieu')    return cach + veSoLon_(k.ds);
    if (k.kieu === 'chip')      return veChip_(k.ds);
    if (k.kieu === 'bieuTuong') return cach + veBieuTuong_(k.ds);
    if (k.kieu === 'theGia')    return cach + veTheGia_(k.ds);
    if (k.kieu === 'bieuDo')    return cach + veBieuDo_(k.ds);
    if (k.kieu === 'phuDe')     return vePhuDe_(k.ds, i === 0);
    if (k.kieu === 'ghiChu')    return veGhiChu_(k.ds);
    return veChiTiet_(k.ds);            // dòng chi tiết → thu gọn trong "Xem chi tiết"
  }).join('');
}

function veSoLon_(ds) {
  return '<div class="gt-so-lon">' + ds.map(function (d) {
    return '<div><div class="so">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + '<div class="nhan">' + gtThoat_(layTheoNN_(d.muc)) + '</div></div>';
  }).join('') + '</div>';
}

function veChip_(ds) {
  return '<div class="gt-chip">' + ds.map(function (d) {
    return '<span>' + gtThoat_(layTheoNN_(d.muc)) + ' ' + gtThoat_(layTheoNN_(d.giaTri)) + '</span>';
  }).join('') + '</div>';
}

function vePhuDe_(ds, oDau) {
  return ds.map(function (d) {
    return '<div class="gt-phu-de' + (oDau ? ' tren' : '') + '">'
         + gtThoat_(layTheoNN_(d.giaTri)) + '</div>';
  }).join('');
}

function veBieuTuong_(ds) {
  return '<div class="gt-bieu-tuong">' + ds.map(function (d) {
    var nhan = layTheoNN_(d.muc);
    var phu  = layTheoNN_(d.phu);
    return '<div>'
         + (d.icon ? '<div class="ic">' + gtThoat_(d.icon) + '</div>' : '')
         + '<div class="tri">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + (nhan ? '<div class="nhan">' + gtThoat_(nhan) + '</div>' : '')
         + (phu  ? '<div class="phu">'  + gtThoat_(phu)  + '</div>' : '')
         + '</div>';
  }).join('') + '</div>';
}

/** Thẻ giá: phần phụ chú tách 2 dòng bằng dấu || (đơn vị || ghi chú) */
function veTheGia_(ds) {
  return '<div class="gt-the-gia">' + ds.map(function (d) {
    var phu = layTheoNN_(d.phu).split('||');
    return '<div class="the">'
         + '<div class="ten">' + gtThoat_(layTheoNN_(d.muc)) + '</div>'
         + '<div class="gia">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + (phu[0] ? '<div class="dv">'  + gtThoat_(phu[0].trim()) + '</div>' : '')
         + (phu[1] ? '<div class="phu">' + gtThoat_(phu[1].trim()) + '</div>' : '')
         + '</div>';
  }).join('') + '</div>';
}

/** Biểu đồ thanh ngang, có cờ quốc gia lấy từ cột MaCo */
function veBieuDo_(ds) {
  var soCua = function (d) {
    var n = parseFloat(String(layTheoNN_(d.giaTri)).replace(/[^0-9.,]/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  };
  var lonNhat = 0;
  ds.forEach(function (d) { lonNhat = Math.max(lonNhat, soCua(d)); });
  if (!lonNhat) lonNhat = 1;

  return '<div class="gt-bieu-do">' + ds.map(function (d) {
    var n  = soCua(d);
    var pt = Math.max(3, Math.round(n / lonNhat * 100));
    var co = d.maCo
      ? '<img class="gt-bd-co" alt="" loading="lazy" src="https://flagcdn.com/40x30/' + gtThoat_(d.maCo) + '.png" '
        + 'onerror="this.style.display=\'none\'">'
      : '';
    return '<div class="gt-bd-dong">'
         + '<div class="gt-bd-ten">' + co + '<span>' + gtThoat_(layTheoNN_(d.muc)) + '</span></div>'
         + '<div class="gt-bd-rai"><div class="gt-bd-thanh" style="width:' + pt + '%"></div></div>'
         + '<div class="gt-bd-so">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>'
         + '</div>';
  }).join('') + '</div>';
}

function veGhiChu_(ds) {
  return ds.map(function (d) {
    return '<div class="gt-ghi-chu">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div>';
  }).join('');
}

/** Các dòng chi tiết — mặc định thu gọn để màn hình trình bày không bị rối chữ */
function veChiTiet_(ds) {
  var nhanMo = { vi: 'Xem chi tiết', en: 'View details', zh: '查看详情' }[NN_KCN] || 'Xem chi tiết';
  return '<details class="gt-chi-tiet"><summary>' + nhanMo + '</summary>'
       + veDong_(ds) + '</details>';
}

function veDong_(ds) {
  return '<div class="gt-luoi-dong">' + ds.map(function (d) {
    return '<div class="gt-dong">'
         + '<div class="muc">' + (d.icon ? gtThoat_(d.icon) + ' ' : '') + gtThoat_(layTheoNN_(d.muc)) + '</div>'
         + '<div class="gt">' + gtThoat_(layTheoNN_(d.giaTri)) + '</div></div>';
  }).join('') + '</div>';
}

/** Cuộn tới phần tương ứng và làm nổi bật nút trên thanh điều hướng */
function nhayToiPhan_(nut) {
  var el = document.getElementById(nut.dataset.phan);
  if (!el) return;
  Array.prototype.forEach.call(
    document.querySelectorAll('#gtDieuHuong button'),
    function (b) { b.classList.toggle('dang-chon', b === nut); }
  );
  try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  catch (e) { el.scrollIntoView(); }
}

/***********************************************************************
 * HỒ SƠ PDF · SAO CHÉP · CHIA SẺ
 ***********************************************************************/
function layLinkHoSoKCN_() {
  var ch = (typeof DU_LIEU !== 'undefined' && DU_LIEU && DU_LIEU.cauHinh) ? DU_LIEU.cauHinh : {};
  return String(ch['LinkHoSoKCN_' + NN_KCN.toUpperCase()] || ch.LinkHoSoKCN || '').trim();
}

function capNhatNutPDF_() {
  var nut  = document.getElementById('gtNutPDF');
  var link = layLinkHoSoKCN_();
  if (!nut) return;
  if (link) {
    nut.style.display = '';
    nut.textContent   = NHAN_KCN[NN_KCN].pdf;
    nut.onclick = function () { window.open(link, '_blank'); };
  } else {
    nut.style.display = 'none';
  }
}

function noiDungGioiThieuVanBan_() {
  var ds = (TT_KCN && TT_KCN.dong) ? TT_KCN.dong : [];
  var out = [NHAN_KCN[NN_KCN].tieuDe, ''];
  var nhomHienTai = '';

  ds.forEach(function (d) {
    if (d.kieu === 'bieuDo') return;              // bỏ danh sách quốc tịch cho gọn tin nhắn
    var ten = layTheoNN_(d.nhom);
    if (ten && ten !== nhomHienTai) { nhomHienTai = ten; out.push('— ' + ten.toUpperCase() + ' —'); }
    out.push('• ' + layTheoNN_(d.muc) + ': ' + layTheoNN_(d.giaTri));
  });

  var link = layLinkHoSoKCN_();
  if (link) out.push('', '📄 ' + link);
  out.push('', 'Sonadezi Long Thanh Shareholding Company', '☎ 84-251-3514494 | ✉ longthanhiz@szl.com.vn');
  return out.join('\n');
}

function saoChepGioiThieu() {
  var vb = noiDungGioiThieuVanBan_();
  var xong = function () { alert(NHAN_KCN[NN_KCN].daSao); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(vb).then(xong, function () { saoChepDuPhong_(vb, xong); });
  } else {
    saoChepDuPhong_(vb, xong);
  }
}

function saoChepDuPhong_(vb, xong) {
  var o = document.createElement('textarea');
  o.value = vb;
  o.style.position = 'fixed'; o.style.opacity = '0';
  document.body.appendChild(o);
  o.select();
  try { document.execCommand('copy'); xong(); } catch (e) { alert(vb); }
  document.body.removeChild(o);
}

function chiaSeGioiThieu() {
  var vb = noiDungGioiThieuVanBan_();
  if (navigator.share) navigator.share({ title: NHAN_KCN[NN_KCN].tieuDe, text: vb }).catch(function () {});
  else saoChepGioiThieu();
}

/* ----- Gắn sự kiện ----- */
(function () {
  var oNN = document.getElementById('gtNgonNgu');
  if (oNN) {
    Array.prototype.forEach.call(oNN.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { doiNgonNguKCN(b.dataset.nn); });
    });
  }
  var bSao = document.getElementById('gtNutSaoChep');
  if (bSao) bSao.addEventListener('click', saoChepGioiThieu);
  var bChiaSe = document.getElementById('gtNutChiaSe');
  if (bChiaSe) bChiaSe.addEventListener('click', chiaSeGioiThieu);
})();
</script>
