let BC_DON_VI = null;

const MAU_TIN_MAC_DINH =
  'Kính gửi Quý khách,\n\n'
+ 'Công ty CP Sonadezi Long Thành trân trọng giới thiệu:\n\n'
+ '🏭 {TenNhaXuong}\n'
+ '📍 Khu vực: {TenCum}\n'
+ '📐 Diện tích đất: {DienTichDat}\n'
+ '🏗️ Diện tích xây dựng: {DienTichXayDung}\n'
+ '💰 Đơn giá: {GiaThue}\n'
+ '✅ Tình trạng: {TrangThai}\n\n'
+ '📎 Tài liệu đính kèm:\n{DanhSachLink}\n\n'
+ '{LinkDinhVi}'
+ 'Rất mong được đón tiếp Quý khách tham quan thực tế.\n\n'
+ 'Trân trọng,\n{NguoiLienHe}\n{SoDienThoai}\n{Email}';

function moBrochure(ma) {
  const nx = timNhaXuong(ma);
  if (!nx) return;
  BC_DON_VI = nx;

  document.getElementById('bcTenDonVi').textContent = nx.TenNhaXuong || ma;
  document.getElementById('bcThongBao').textContent = '';

  const ds = layDanhSachTaiLieu(nx);

  if (ds.length === 0) {
    document.getElementById('bcDanhSach').innerHTML =
      '<div class="canh-bao">⚠ Đơn vị này chưa có tài liệu nào. '
      + 'Bổ sung tại sheet <b>DS_TaiLieu</b> hoặc cột <b>LinkBrochure</b>.</div>';
  } else {
    // ★ Gom theo loại, hiển thị dạng thư mục gấp/mở (đồng bộ kiểu với panel chi tiết)
    //   — tránh danh sách dài khi có nhiều Hình ảnh. Chỉ số "data-i" vẫn trỏ đúng
    //   vào mảng ds gốc nên soanTinNhan() không cần đổi gì.
    const nhom = {};
    const thuTuLoai = [];
    ds.forEach(function (t, i) {
      const l = t.loai || 'Khác';
      if (!nhom[l]) { nhom[l] = []; thuTuLoai.push(l); }
      nhom[l].push(i);
    });

    document.getElementById('bcDanhSach').innerHTML = thuTuLoai.map(function (loai, idxNhom) {
      const idThan = 'bcThan_' + idxNhom;
      const than = nhom[loai].map(function (i) {
        const t = ds[i];
        return '<label class="bc-muc">'
             + '<input type="checkbox" class="bc-chon" data-i="' + i + '" checked '
             +   'onchange="soanTinNhan()">'
             + '<span class="bc-ten">📄 ' + t.ten + '</span>'
             + '<a href="' + t.link + '" target="_blank" rel="noopener" class="bc-xem" '
             +   'onclick="event.stopPropagation()">Xem ↗</a>'
             + '</label>';
      }).join('');

      return '<div class="muc-tai-lieu" style="cursor:pointer;margin-bottom:4px" '
           +   'onclick="bcBatMoNhom(\'' + idThan + '\', this)">'
           + '▸ 📁 ' + loai + ' (' + nhom[loai].length + ' tệp)'
           + '</div>'
           + '<div id="' + idThan + '" style="display:none;margin-left:14px;margin-bottom:8px">'
           + than + '</div>';
    }).join('');
  }

  // ★ Phân quyền: khách chỉ XEM brochure, không soạn/gửi thông tin chào thuê
  const khoiGui = document.getElementById('bcKhoiSoanGui');
  const tdTaiLieu = document.getElementById('bcTieuDeTaiLieu');
  if (laKhach()) {
    if (khoiGui) khoiGui.style.display = 'none';
    if (tdTaiLieu) tdTaiLieu.textContent = 'Tài liệu brochure';
  } else {
    if (khoiGui) khoiGui.style.display = '';
    if (tdTaiLieu) tdTaiLieu.textContent = 'Chọn tài liệu gửi khách';
    soanTinNhan();
  }

  document.getElementById('hopThoaiBrochure').classList.remove('an');
}

function dongBrochure() {
  document.getElementById('hopThoaiBrochure').classList.add('an');
}

/** Mở/đóng 1 nhóm loại tài liệu trong hộp thoại Brochure & Chia sẻ */
function bcBatMoNhom(idThan, dongTieuDe) {
  const than = document.getElementById(idThan);
  if (!than) return;
  const dangMo = than.style.display !== 'none';
  than.style.display = dangMo ? 'none' : 'block';
  dongTieuDe.textContent = dongTieuDe.textContent.replace(
    dangMo ? '▾' : '▸', dangMo ? '▸' : '▾');
}

/** Gom tài liệu từ DS_TaiLieu + LinkBrochure + brochure chung của KCN */
function layDanhSachTaiLieu(nx) {
  const ds = [];

  (nx.DanhSachTaiLieu || []).forEach(function (t) {
    if (t.link) ds.push({ ten: t.ten || 'Tài liệu', link: t.link, loai: t.loai || '' });
  });

  if (nx.LinkBrochure) {
    ds.push({ ten: 'Brochure ' + (nx.TenNhaXuong || nx.MaDonVi),
              link: nx.LinkBrochure, loai: 'Brochure' });
  }
  if (nx.LinkAnh) {
    ds.push({ ten: 'Hình ảnh thực tế', link: nx.LinkAnh, loai: 'Hình ảnh' });
  }

  const ch = DU_LIEU.cauHinh || {};
  if (ch.BrochureChungKCN) {
    ds.push({ ten: 'Brochure tổng quan KCN Long Thành',
              link: ch.BrochureChungKCN, loai: 'Tổng quan' });
  }
  return ds;
}

/** Sinh nội dung tin nhắn từ mẫu trong DM_CauHinh — v3.3 */
function soanTinNhan() {
  if (!BC_DON_VI) return;
  const nx = BC_DON_VI;
  const ch = DU_LIEU.cauHinh || {};

  const ds = layDanhSachTaiLieu(nx);
  const chon = [];
  document.querySelectorAll('.bc-chon').forEach(function (cb) {
    if (cb.checked) chon.push(ds[parseInt(cb.dataset.i, 10)]);
  });

  const dsLink = chon.length
    ? chon.map(function (t) { return '• ' + t.ten + ':\n' + t.link; }).join('\n')
    : '(chưa chọn tài liệu)';

  let linkDinhVi = '';
  if (nx.Lat && nx.Lng) {
    linkDinhVi = '📍 Vị trí trên bản đồ:\n'
               + 'https://www.google.com/maps/search/?api=1&query='
               + nx.Lat + ',' + nx.Lng + '\n\n';
  }

  const cum = (DU_LIEU.cum || []).filter(function (c) {
    return c.MaCum === nx.MaCum;
  })[0];

  const laDat = laLoaiDat(nx);

  // ★ Giá chào thuê theo đúng LoaiHinh
  // (Chế độ khách: các trường này đã bị server xoá trắng → tự về "Liên hệ")
  let giaChaoThue = 'Liên hệ';
  if (!laDat) {
    // ★ SỬA — bỏ đơn vị cố định, gõ kèm đơn vị ngay trong ô "Đơn giá" khi cần.
    giaChaoThue = nx['TienThueXuong - DonGia (USD)'] || 'Liên hệ';
  } else {
    const giaMB  = nx['TienThueMatBang - DonGia (USD)'];
    const giaTho = nx['TienDatTho - DonGia (USD)'];
    const phanGia = [];
    // ★ SỬA — bỏ đơn vị cố định, gõ kèm đơn vị ngay trong ô "Đơn giá" khi cần.
    if (giaMB)  phanGia.push('Tiền thuê mặt bằng: ' + giaMB);
    // ★ SỬA — bỏ đơn vị cố định, gõ kèm đơn vị ngay trong ô "Đơn giá" khi cần.
    if (giaTho) phanGia.push('Tiền đất thô: '       + giaTho);
    giaChaoThue = phanGia.length ? phanGia.join('\n• ') : 'Liên hệ';
  }

  const ptttPQL   = nx['PhiQuanLy - PTThanhToan'] || '';
  // ★ SỬA — bỏ đơn vị cố định "USD/m²/năm".
  const phiQuanLy = nx['PhiQuanLy (USD)']
    ? ghepGiaPT(nx['PhiQuanLy (USD)'], ptttPQL)
    : 'Liên hệ';

  // ★ Chọn mẫu riêng cho Đất cho thuê nếu DM_CauHinh có khai báo
  // ★ V4.7: ưu tiên mẫu riêng cho Đất ở KDC (khoá MauTinNhanZalo_KDC),
  //         sau đó mới đến mẫu Đất cho thuê, cuối cùng là mẫu chung.
  const mau = (laDatOKDC(nx) && ch.MauTinNhanZalo_KDC)
    ? ch.MauTinNhanZalo_KDC
    : ((laDat && ch.MauTinNhanZalo_Dat)
        ? ch.MauTinNhanZalo_Dat
        : (ch.MauTinNhanZalo || MAU_TIN_MAC_DINH));
// ★ PA-B — Người liên hệ: ưu tiên thông tin cá nhân người đăng nhập;
  //   khách/chưa đăng nhập → dùng thông tin chung trong DM_CauHinh
  const nguoiKy = (NGUOI_DUNG && NGUOI_DUNG.nhanDienDuoc)
    ? { ten  : NGUOI_DUNG.hoTen       || ch.NguoiLienHe || '',
        sdt  : NGUOI_DUNG.soDienThoai || ch.SoDienThoai || '',
        email: NGUOI_DUNG.emailLienHe || NGUOI_DUNG.email || ch.Email || '' }
    : { ten  : ch.NguoiLienHe || '',
        sdt  : ch.SoDienThoai || '',
        email: ch.Email       || '' };
  let tin = String(mau)
    .replace(/{MaDonVi}/g,          nx.MaDonVi || '')
    .replace(/{TenNhaXuong}/g,      nx.TenNhaXuong || nx.MaDonVi || '')
    .replace(/{TenCum}/g,           (cum && cum.TenCum) || nx.MaCum || '')
    .replace(/{LoaiHinh}/g,         nx.LoaiHinh || '')
    .replace(/{TrangThai}/g,        nx.TrangThai || '')
    .replace(/{TienDo}/g,           nx.TienDo || '')
    .replace(/{ThoiHanThue}/g,      nx.ThoiHanThue || 'Theo thoả thuận')
    .replace(/{LoDatThue}/g,        nx.LoDatThue || 'Liên hệ')
    // --- Diện tích ---
    .replace(/{DienTichXuong_m2}/g,        dinhDangSo(nx.DienTichXuong_m2, 'm²') || 'Liên hệ')
    .replace(/{DienTichKhuDat_m2}/g,       dinhDangSo(nx.DienTichKhuDat_m2, 'm²') || 'Liên hệ')
    .replace(/{TongDienTichDatThue_m2}/g,  dinhDangSo(nx['Tong DienTichDatThue (m2)'], 'm²') || 'Liên hệ')
    .replace(/{DienTichDatThueThem_m2}/g,  dinhDangSo(nx['DienTichDatThueThem (m2)'], 'm²') || '—')
    // --- Giá (tên ngắn, khuyến nghị dùng) ---
    .replace(/{GiaChaoThue}/g,      giaChaoThue)
    .replace(/{PhiQuanLy}/g,        phiQuanLy)
    .replace(/{PhiQuanLy_PTThanhToan}/g, ptttPQL || 'Theo thoả thuận')
    // --- Giữ tương thích mẫu cũ (tên cột đầy đủ có dấu ngoặc) ---
    .replaceAll('{TienThueXuong - DonGia (USD)}', giaChaoThue)
    .replaceAll('{PhiQuanLy (USD)}',              phiQuanLy)
    // --- Khối động ---
    .replace(/{DanhSachLink}/g,     dsLink)
    .replace(/{LinkDinhVi}/g,       linkDinhVi)
    .replace(/{NguoiLienHe}/g,      nguoiKy.ten)
    .replace(/{SoDienThoai}/g,      nguoiKy.sdt)
    .replace(/{Email}/g,            nguoiKy.email)
    .replace(/{Website}/g,          ch.Website || '');

  // ★ Dọn dẹp cuối: xoá placeholder còn sót, dòng gạch đầu dòng rỗng, dòng trắng thừa
  tin = tin
    .replace(/{[^{}]+}/g, '')
    .replace(/^[•\-–]\s*$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  document.getElementById('bcTinNhan').value = tin;
}

/* ---------- Sao chép ---------- */
function saoChepTinNhan() {
  const o = document.getElementById('bcTinNhan');
  o.select();
  o.setSelectionRange(0, 999999);

  const xong = function () {
    baoBrochure('✓ Đã sao chép. Mở Zalo và dán (Ctrl+V) vào cửa sổ chat.', 'ok');
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(o.value).then(xong).catch(function () {
      document.execCommand('copy'); xong();
    });
  } else {
    document.execCommand('copy'); xong();
  }
}

/* ---------- Chia sẻ qua hệ thống (điện thoại -> chọn Zalo) ---------- */
function chiaSeHeThong() {
  const noiDung = document.getElementById('bcTinNhan').value;
  const tieuDe  = BC_DON_VI ? (BC_DON_VI.TenNhaXuong || BC_DON_VI.MaDonVi) : 'KCN Long Thành';

  if (navigator.share) {
    navigator.share({ title: tieuDe, text: noiDung })
      .then(function () { baoBrochure('✓ Đã mở bảng chia sẻ.', 'ok'); })
      .catch(function () { /* người dùng huỷ */ });
  } else {
    saoChepTinNhan();
    baoBrochure('⚠ Trình duyệt máy tính không hỗ trợ chia sẻ trực tiếp. '
      + 'Nội dung đã được sao chép — hãy mở Zalo và dán vào.', 'ok');
  }
}

/* ---------- Mở Zalo Web ---------- */
function moZaloWeb() {
  saoChepTinNhan();
  window.open('https://chat.zalo.me', '_blank', 'noopener');
  baoBrochure('✓ Đã sao chép nội dung và mở Zalo Web. Chọn khách hàng rồi dán (Ctrl+V).', 'ok');

/* ---------- Hộp thoại thay cho alert / confirm / prompt ---------- */
let HOP_V5_DOI = [];

function hopV5Mo_(cfg) {
  return new Promise(function (xong) {
    HOP_V5_DOI.push({ cfg: cfg, xong: xong });
    if (HOP_V5_DOI.length === 1) hopV5Hien_();
  });
}

function hopV5Hien_() {
  const muc = HOP_V5_DOI[0];
  if (!muc) return;
  let lop = document.getElementById('hopV5');
  if (!lop) {
    lop = document.createElement('div');
    lop.id = 'hopV5';
    lop.setAttribute('role', 'dialog');
    lop.setAttribute('aria-modal', 'true');
    document.body.appendChild(lop);
  }
  const c = muc.cfg;
  lop.className = '';
  lop.innerHTML = '<div class="hop-v5"><p></p><div class="vung-nhap"></div><div class="dong-nut"></div></div>';
  lop.querySelector('p').textContent = c.tieuDe;

  let o = null;
  if (c.nhap !== undefined) {
    o = document.createElement(c.dai ? 'textarea' : 'input');
    o.value = c.nhap;
    if (c.dai) o.readOnly = true;
    lop.querySelector('.vung-nhap').appendChild(o);
  }
  const dong = lop.querySelector('.dong-nut');
  const dongLai = function (kq) {
    lop.className = 'an';
    HOP_V5_DOI.shift();
    muc.xong(kq);
    hopV5Hien_();
  };
  if (c.nutHuy) {
    const h = document.createElement('button');
    h.type = 'button';
    h.textContent = c.nutHuy;
    h.onclick = function () { dongLai(c.nhap !== undefined ? null : false); };
    dong.appendChild(h);
  }
  const ok = document.createElement('button');
  ok.type = 'button';
  ok.className = c.nguyHiem ? 'nguy' : 'chinh';
  ok.textContent = c.nutOk || 'Đã hiểu';
  ok.onclick = function () { dongLai(o ? o.value : true); };
  dong.appendChild(ok);

  setTimeout(function () {
    if (o) { o.focus(); o.select(); } else { ok.focus(); }
  }, 30);
}

function xacNhanV5(tieuDe, nutOk, nguyHiem) {
  return hopV5Mo_({ tieuDe: tieuDe, nutOk: nutOk || 'Đồng ý', nutHuy: 'Huỷ', nguyHiem: !!nguyHiem });
}

function nhapV5(tieuDe, macDinh) {
  return hopV5Mo_({ tieuDe: tieuDe, nhap: macDinh || '', nutOk: 'Lưu', nutHuy: 'Huỷ' });
}

window.prompt = function (nd, gt) {

const ICON_V5 = {
  '🏭':'nha-may','🏢':'toa-nha','🗺':'ban-do','📋':'bang','📌':'ghim','🔔':'chuong','💐':'qua','👤':'nguoi','👥':'nhom',
  '🔍':'tim','🔎':'tim','⏰':'gio','⏳':'gio','✏':'but','💾':'luu','📤':'gui','💡':'den','📱':'dt','💬':'tin','🔑':'khoa',
  '📍':'dinh','📄':'tep','📎':'ghim-tep','👁':'mat','🔐':'khoa','🚪':'ra','🚗':'dan-duong','☑':'chon','✅':'chon','📘':'sach',
  '🖼':'anh','📐':'thuoc','📁':'muc','🗑':'xoa','🔀':'doi','🔄':'lam-moi','❌':'x-tron','📊':'bieu-do','📜':'tep','📝':'but',
  '🗒':'tep','⚙':'cai-dat','⚠':'canh-bao','💵':'tien','⚡':'dien','🌏':'dia-cau','☎':'dt-ban','✉':'thu'
};
const MAU_EMOJI_V5 = new RegExp('(' + Object.keys(ICON_V5).join('|') + ')\\uFE0F?', 'gu');
const BO_QUA_V5 = { SCRIPT:1, STYLE:1, OPTION:1, TEXTAREA:1, TITLE:1, text:1, title:1 };

function thayEmojiTrongNut_(nut) {
  const cha = nut.parentNode;
  if (!cha || BO_QUA_V5[cha.nodeName] || !MAU_EMOJI_V5.test(nut.nodeValue)) { MAU_EMOJI_V5.lastIndex = 0; return; }
  MAU_EMOJI_V5.lastIndex = 0;
  const ct = document.createElement('span');
  const an = nut.nodeValue.replace(/[&<>]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; });
  ct.innerHTML = an.replace(MAU_EMOJI_V5, function (e, g) {
    return '<svg class="ikon" aria-hidden="true"><use href="#i-' + ICON_V5[g] + '"></use></svg>';
  });
  while (ct.firstChild) cha.insertBefore(ct.firstChild, nut);
  cha.removeChild(nut);
}

function quetEmojiV5_(goc) {
  if (!goc || goc.nodeType !== 1 && goc.nodeType !== 11) return;
  const dt = [], w = document.createTreeWalker(goc, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) dt.push(n);
  dt.forEach(thayEmojiTrongNut_);
}

function khoiDongV5_() {
  const khoi = document.getElementById('khoiLoc');
  if (khoi) {
    khoi.addEventListener('input', capNhatDemLocV5);
    khoi.addEventListener('change', capNhatDemLocV5);
    khoi.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'nutXoaLoc') setTimeout(capNhatDemLocV5, 0);
    });
  }
  xepCanhBaoV5();
  window.addEventListener('resize', xepCanhBaoV5);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') dongBoLocV5(); });

  quetEmojiV5_(document.body);
  let cho = [];
  new MutationObserver(function (ds) {
    ds.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType === 1) cho.push(n);
        else if (n.nodeType === 3) thayEmojiTrongNut_(n);
      });
    });
    if (cho.length) {
      const lo = cho; cho = [];
      requestAnimationFrame(function () { lo.forEach(quetEmojiV5_); });
    }
  }).observe(document.body, { childList: true, subtree: true });
}

/** Nền ô chú giải: "Sắp trống" có sọc để không lẫn với "Trống" */
function nenTrangThaiV5(ten, mau) {
  return String(ten).trim() === 'Sắp trống'
    ? 'repeating-linear-gradient(45deg,' + mau + ' 0 3px,#fff 3px 6px)'
    : mau;
}
