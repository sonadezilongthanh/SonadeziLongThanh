<script>
/***********************************************************************
 * GIAO DIỆN HỆ THỐNG TRA CỨU KCN LONG THÀNH — PHIÊN BẢN 4.0
 * ★ V4.0 (23/07/2026) — XÁC THỰC THEO TÀI KHOẢN CÁ NHÂN:
 *   • Đăng nhập bằng Email + mật khẩu riêng (không còn mật khẩu dùng chung)
 *   • Bổ sung màn hình Đăng ký tài khoản (chờ quản trị cấp quyền)
 *   • Bổ sung hộp thoại Đổi mật khẩu và màn hình Quản lý tài khoản
 *   • Đã gỡ bỏ toàn bộ cơ chế "Mã khoá chỉnh sửa"
 *   • Quyền sửa: QuanTri và NhapLieu
 * ★ V3.3 — Form chỉnh sửa đọc/ghi đúng cột theo LoaiHinh (giữ nguyên)
 ***********************************************************************/
let DU_LIEU     = { nhaXuong: [], cum: [], trangThai: [] };
let NGUOI_DUNG  = { duocSua: false, laQuanTri: false };
let MAU_TRANG_THAI = {};   // { "Trống": "#22c55e", ... }
let KET_QUA_LOC = [];
let MA_DANG_MO  = null;
let PANEL_TL_CHON = new Set();   // các FileId đang được tick chọn trong panel chi tiết

const MAU_MAC_DINH = '#94a3b8';

/* ★ V4.0 — Phiên truy cập (không chứa mật khẩu, chỉ chứa token đã ký)
 *   vaiTro: 'QuanTri' | 'NhapLieu' | 'ChiXem' | 'Khach' */
let PHIEN_SUA = { token: '', email: '', hoTen: '', vaiTro: '' };

/* Chống gắn sự kiện / nạp bộ lọc trùng khi tải lại dữ liệu */
let DA_GAN_GIAO_DIEN = false;

/** Quyền sửa hiệu lực — do SERVER xác nhận qua vai trò của tài khoản */
function duocPhepSua() {
  const vt = PHIEN_SUA.vaiTro || NGUOI_DUNG.vaiTro;
  // ★ SỬA: QuanLy chỉ xem — bỏ khỏi danh sách được sửa
  return !!(NGUOI_DUNG.duocSua || vt === 'QuanTri' || vt === 'NhapLieu');
}

/** Có phải tài khoản quản trị không */
function laQuanTri() {
  return (PHIEN_SUA.vaiTro || NGUOI_DUNG.vaiTro) === 'QuanTri';
}

/** Có phải tài khoản Quản lý không */
function laQuanLy() {
  return (PHIEN_SUA.vaiTro || NGUOI_DUNG.vaiTro) === 'QuanLy';
}

/** Được xem bảng theo dõi công việc toàn phòng (Quản trị + Quản lý) */
function xemCongViec() {
  const vt = PHIEN_SUA.vaiTro || NGUOI_DUNG.vaiTro;
  return !!(NGUOI_DUNG.xemCongViec || vt === 'QuanTri' || vt === 'QuanLy');
}

/** Chế độ khách — chưa đăng nhập hoặc vai trò 'Khach'.
 *  Khách: KHÔNG xuất Excel, KHÔNG soạn/gửi thông tin chào thuê; chỉ xem brochure. */
function laKhach() {
  const vt = PHIEN_SUA.vaiTro || NGUOI_DUNG.vaiTro;
  return (!PHIEN_SUA.token) || vt === 'Khach' || (NGUOI_DUNG && NGUOI_DUNG.nhanDienDuoc === false);
}


/***********************************************************************
 * TIỆN ÍCH THAO TÁC AN TOÀN VỚI Ô NHẬP
 ***********************************************************************/

/** Lấy phần tử theo id, trả về null nếu không có */
function _o(id) {
  return document.getElementById(id) || null;
}

/** Gán giá trị vào ô nhập nếu ô đó tồn tại */
function _ganO(id, giaTri) {
  const el = _o(id);
  if (el) el.value = (giaTri === null || giaTri === undefined) ? '' : giaTri;
}

/**
 * Thêm 1 trường vào object gửi server — CHỈ KHI ô nhập tồn tại.
 * @param {Object} obj    object dữ liệu sẽ gửi lên server
 * @param {string} tenCot tên cột chính xác trong Sheet DS_NhaXuong
 * @param {string} id     id của ô nhập trên form
 */
function _layO(obj, tenCot, id) {
  const el = _o(id);
  if (!el) return;              // ô chưa có trên form → bỏ qua, không ghi rỗng
  obj[tenCot] = el.value;
}

/** Thoát ký tự đặc biệt khi dựng HTML */
function _escHTML(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}


/***********************************************************************
 * KHỞI ĐỘNG: MÀN HÌNH ĐĂNG NHẬP TRƯỚC, TẢI DỮ LIỆU SAU
 ***********************************************************************/
window.addEventListener('load', function () {
  khoiPhucPhienSua();
  xinPhienTuVo_(function () {   // ★ V5.3
    taoManHinhDangNhap();
    taoHopThoaiDoiMK();
    taoHopThoaiQuanLyTK();
    taoMenuTaiKhoan();
    khoiDongV5_();   // ★ V5.0

    if (PHIEN_SUA.vaiTro) {
      // Đã có phiên trong tab này (kể cả chế độ khách) → vào thẳng
      // ★ V4.11 — phiên đã đăng nhập: màn chờ chính là hiệu ứng Mở kho
      if (PHIEN_SUA.token) moKhoBatDau_(true);
      taiDuLieu();
    } else {
      hienManHinhDangNhap();
    }
  });
});

/***********************************************************************
 * ★ V5.3 — GIỮ ĐĂNG NHẬP TRONG VỎ PWA (biểu tượng màn hình chính)
 *  App chạy trong iframe trên tên miền googleusercontent, nên localStorage
 *  của app dễ bị mất/phân vùng. Khi mở từ vỏ PWA trên GitHub Pages, phiên
 *  "Ghi nhớ đăng nhập" được lưu thêm ở vỏ (tên miền chính) qua postMessage.
 *  Hạn phiên vẫn do token server ký, không thay đổi.
 ***********************************************************************/
const NGUON_VO_PWA = 'https://sonadezilongthanh.github.io';
const VO_PWA = { co: false, coPhien: false, email: '', chonGhiNho: '' };

function trongVoPwa_() {
  try {
    const ds = window.location.ancestorOrigins;
    return !!ds && Array.prototype.indexOf.call(ds, NGUON_VO_PWA) >= 0;
  } catch (e) { return false; }
}

function guiVoPwa_(goi) {
  if (!VO_PWA.co) return;
  try { window.top.postMessage(Object.assign({ szl: true }, goi), NGUON_VO_PWA); } catch (e) {}
}

/** Hỏi vỏ PWA phiên đã lưu rồi mới khởi động; không ở trong vỏ thì chạy ngay */
function xinPhienTuVo_(xong) {
  VO_PWA.co = trongVoPwa_();
  if (!VO_PWA.co) { xong(); return; }

  let daXong = false, hen = null;
  function ketThuc() {
    if (daXong) return;
    daXong = true;
    clearTimeout(hen);
    window.removeEventListener('message', nhan);
    xong();
  }
  function nhan(ev) {
    if (ev.origin !== NGUON_VO_PWA || !ev.data || ev.data.szl !== 'phien') return;
    VO_PWA.email = String(ev.data.email || '');
    VO_PWA.chonGhiNho = String(ev.data.chon || '');
    const p = ev.data.phien;
    if (p && p.token && p.email && p.vaiTro && hanToken_(p.token) > Date.now()) {
      VO_PWA.coPhien = true;
      if (!PHIEN_SUA.token) {
        PHIEN_SUA = { token: p.token, email: p.email, hoTen: p.hoTen || '', vaiTro: p.vaiTro };
        try { sessionStorage.setItem('SZL_PHIEN_SUA', JSON.stringify(PHIEN_SUA)); } catch (e) {}
        henGioHetPhien_();
      }
    }
    ketThuc();
  }
  window.addEventListener('message', nhan);
  hen = setTimeout(ketThuc, 1200);
  guiVoPwa_({ lenh: 'xin-phien' });
}

/** Gọi server tải dữ liệu — server tự lọc thông tin nội bộ nếu là khách */
function taiDuLieu() {
  // ★ V4.10 — hiệu ứng Mở kho đang chạy thì lớp phủ đảm nhận luôn màn hình đăng nhập và màn hình tải
  if (!MO_KHO.chay) {
    anManHinhDangNhap();
    const mt = document.getElementById('manHinhTai');
    if (mt) mt.classList.remove('an');
  }
  const ud = document.getElementById('ungDung');
  if (ud) ud.classList.add('an');

  google.script.run
    .withSuccessHandler(khoiTaoApp)
    .withFailureHandler(function (loi) {
      moKhoHuy_();   // ★ V4.10
      document.getElementById('manHinhTai').innerHTML =
        '<p style="color:#b91c1c">Lỗi tải dữ liệu: ' + loi.message + '</p>';
    })
    .layDuLieuTongHop({ token: PHIEN_SUA.token });
}

function khoiTaoApp(dl) {
  DU_LIEU    = dl;
  NGUOI_DUNG = dl.nguoiDung || { duocSua: false, laQuanTri: false };

  // ★ Đồng bộ vai trò do SERVER xác nhận.
  // Nếu token hết hiệu lực (đổi mật khẩu, bị khoá, bị hạ quyền),
  // server trả về 'Khach' → hạ phiên xuống tương ứng.
  if (NGUOI_DUNG.vaiTro && NGUOI_DUNG.vaiTro !== PHIEN_SUA.vaiTro) {
    PHIEN_SUA.vaiTro = NGUOI_DUNG.vaiTro;
    if (NGUOI_DUNG.vaiTro === 'Khach') {
      // ★ V4.8 — đang đăng nhập mà server trả 'Khach' → phiên hết hạn / bị thu hồi
      const daDangNhap = !!PHIEN_SUA.token;
      PHIEN_SUA.token = '';
      PHIEN_SUA.email = '';
      if (daDangNhap) {
        setTimeout(function () {
          alert('Phiên đăng nhập đã hết hạn hoặc tài khoản đã thay đổi quyền.\n'
              + 'Vui lòng đăng nhập lại để tiếp tục chỉnh sửa.');
        }, 300);
      }
    }
    luuPhienSua();
  }
  if (NGUOI_DUNG.hoTen && NGUOI_DUNG.vaiTro !== 'Khach') {
    PHIEN_SUA.hoTen = NGUOI_DUNG.hoTen;
    PHIEN_SUA.email = NGUOI_DUNG.email || PHIEN_SUA.email;
    luuPhienSua();
  }

  // Bảng màu trạng thái (xây lại từ đầu để tải lại không bị trùng)
  MAU_TRANG_THAI = {};
  (DU_LIEU.trangThai || []).forEach(function (t) {
    MAU_TRANG_THAI[String(t.TenTrangThai).trim()] = t.MauSac || MAU_MAC_DINH;
  });

  capNhatChipVaiTro();
  capNhatHienThiTabCongViec();   // ★ hiện/ẩn tab Công việc theo vai trò

  // ★ Mặc định luôn mở tab BẢN ĐỒ mỗi khi vào ứng dụng (kể cả sau khi đăng nhập lại)
  chuyenTab('banDo');

  // Chỉ nạp bộ lọc + gắn sự kiện 1 lần duy nhất
  if (!DA_GAN_GIAO_DIEN) {
    napBoLoc();
    ganSuKien();
    DA_GAN_GIAO_DIEN = true;
  }
  apDungBoLoc();

  document.getElementById('manHinhTai').classList.add('an');
  document.getElementById('ungDung').classList.remove('an');
  moKhoDuLieuSanSang_();   // ★ V4.10 — báo hiệu ứng Mở kho được phép mở cửa

  // ★ GĐ2: nhắc việc của cán bộ đăng nhập (nếu có)
  try { hienToastThongBaoCuaToi(); } catch (e) {}
}
/** ★ Hiện tab "Công việc" cho Quản trị & Quản lý; ẩn với vai trò khác */
function capNhatHienThiTabCongViec() {
  const nut = document.getElementById('nutTabCongViec');
  if (!nut) return;
  const hien = (typeof xemCongViec === 'function') && xemCongViec();
  nut.style.display = hien ? '' : 'none';
  if (!hien) {
    const sec = document.getElementById('tab-congViec');
    if (sec && sec.classList.contains('hien')) chuyenTab('traCuu');
  }
}
/** Cập nhật tên + chip vai trò trên header (nhấn chip để mở menu tài khoản) */
function capNhatChipVaiTro() {
  const elTen = document.getElementById('tenNguoiDung');
  if (elTen) {
    elTen.textContent = PHIEN_SUA.hoTen || NGUOI_DUNG.hoTen || 'Khách';
  }

  let nhan;
  switch (PHIEN_SUA.vaiTro || NGUOI_DUNG.vaiTro) {
    case 'QuanTri':  nhan = '🔑 Quản trị';    break;
    case 'QuanLy':   nhan = '📋 Quản lý';     break;
    case 'NhapLieu': nhan = '✏️ Nhập liệu';   break;
    case 'ChiXem':   nhan = '👁 Xem nội bộ';  break;
    default:         nhan = 'Chế độ khách';
  }

  const el = document.getElementById('nhanVaiTro');
  if (el) {
    el.textContent = nhan + ' ▾';
    el.title = 'Nhấn để mở menu tài khoản';
    el.style.cursor = 'pointer';
    el.onclick = function (ev) { moMenuTaiKhoan(ev); };
  }

  // ★ Chế độ khách: ẩn nút Xuất Excel (không được xuất dữ liệu)
  const nutXuat = document.getElementById('nutXuatExcel');
  if (nutXuat) nutXuat.style.display = laKhach() ? 'none' : '';

  // ★ V5.2 — khách không có dữ liệu cho các ô lọc nội bộ: ẩn đi và xoá giá trị cũ
  const thanhLoc = document.getElementById('thanhBoLoc');
  if (thanhLoc) thanhLoc.classList.toggle('la-khach', laKhach());
  if (laKhach()) {
    ['locQuocTich', 'locCanBoPhuTrach', 'locHetHan', 'locNganhNghe', 'locDTMin', 'locDTMax']
      .forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
  }
}


/***********************************************************************
 * ★ V4.0 — MENU TÀI KHOẢN (bấm vào chip vai trò trên header)
 ***********************************************************************/
function taoMenuTaiKhoan() {
  if (document.getElementById('menuTaiKhoan')) return;

  document.body.insertAdjacentHTML('beforeend',
      '<style>'
    + '#menuTaiKhoan{position:fixed;z-index:10050;background:#fff;'
    +   'border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.22);'
    +   'min-width:230px;overflow:hidden;border:1px solid #e4e8ef}'
    + '#menuTaiKhoan.an{display:none}'
    + '.mtk-dau{padding:12px 15px;background:#f6f8fc;border-bottom:1px solid #e4e8ef}'
    + '.mtk-ten{font-weight:700;color:#0B4696;font-size:14px}'
    + '.mtk-mail{font-size:12px;color:#7c879a;word-break:break-all;margin-top:2px}'
    + '.mtk-muc{display:block;width:100%;text-align:left;padding:11px 15px;'
    +   'border:none;background:#fff;font-size:14px;color:#243;cursor:pointer}'
    + '.mtk-muc:hover{background:#eef3fb}'
    + '.mtk-muc.thoat{color:#b91c1c;border-top:1px solid #eef0f4}'
    + '#lopPhuMenuTK{position:fixed;inset:0;z-index:10040}'
    + '#lopPhuMenuTK.an{display:none}'
    + '</style>'
    + '<div id="lopPhuMenuTK" class="an" onclick="dongMenuTaiKhoan()"></div>'
    + '<div id="menuTaiKhoan" class="an">'
    +   '<div class="mtk-dau">'
    +     '<div class="mtk-ten" id="mtkTen">—</div>'
    +     '<div class="mtk-mail" id="mtkMail"></div>'
    +   '</div>'
    +   '<div id="mtkDanhSachMuc"></div>'
    + '</div>');
}

function moMenuTaiKhoan(ev) {
  taoMenuTaiKhoan();
  const menu = document.getElementById('menuTaiKhoan');
  const lop  = document.getElementById('lopPhuMenuTK');

  const laKhach = !PHIEN_SUA.token;

  document.getElementById('mtkTen').textContent =
    laKhach ? 'Chế độ khách' : (PHIEN_SUA.hoTen || 'Người dùng');
  document.getElementById('mtkMail').textContent =
    laKhach ? 'Chưa đăng nhập' : (PHIEN_SUA.email || '');

  let html = '';
  if (laKhach) {
    html += '<button class="mtk-muc" onclick="dongMenuTaiKhoan();dangXuat(true)">'
          + '🔐 Đăng nhập tài khoản</button>';
  } else {
    html += '<button class="mtk-muc" onclick="dongMenuTaiKhoan();moDoiMatKhau()">'
          + '🔑 Đổi mật khẩu</button>';
    html += '<button class="mtk-muc" onclick="dongMenuTaiKhoan();moThongTinCaNhan()">'
          + '👤 Thông tin của tôi</button>';
    if (laQuanTri()) {
      html += '<button class="mtk-muc" onclick="dongMenuTaiKhoan();moQuanLyTaiKhoan()">'
            + '👥 Quản lý tài khoản</button>';
    }
    html += '<button class="mtk-muc thoat" onclick="dongMenuTaiKhoan();dangXuat()">'
          + '🚪 Đăng xuất</button>';
  }
  document.getElementById('mtkDanhSachMuc').innerHTML = html;

  lop.classList.remove('an');
  menu.classList.remove('an');

  // Định vị menu ngay dưới chip vai trò
  const chip = document.getElementById('nhanVaiTro');
  if (chip) {
    const r = chip.getBoundingClientRect();
    const rong = menu.offsetWidth || 230;
    let trai = r.right - rong;
    if (trai < 8) trai = 8;
    if (trai + rong > window.innerWidth - 8) trai = window.innerWidth - rong - 8;
    menu.style.left = trai + 'px';
    menu.style.top  = (r.bottom + 8) + 'px';
  }
  if (ev) ev.stopPropagation();
}

function dongMenuTaiKhoan() {
  const m = document.getElementById('menuTaiKhoan');
  const l = document.getElementById('lopPhuMenuTK');
  if (m) m.classList.add('an');
  if (l) l.classList.add('an');
}
/***********************************************************************
 * ★ PA-B — HỘP THOẠI "THÔNG TIN CỦA TÔI"
 ***********************************************************************/
function taoHopThoaiCaNhan() {
  if (document.getElementById('hopThoaiCaNhan')) return;
  const div = document.createElement('div');
  div.id = 'hopThoaiCaNhan';
  div.className = 'an';
  div.style.cssText = 'position:fixed;inset:0;z-index:10060;display:flex;'
    + 'align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px';
  div.innerHTML = ''
    + '<div class="hop-thoai" style="max-width:460px;width:100%">'
    +   '<h3>👤 Thông tin liên hệ của tôi</h3>'
    +   '<div class="than-sua">'
    +     '<div class="dong-form"><label>Họ tên</label>'
    +       '<input type="text" id="cnHoTen" disabled></div>'
    +     '<div class="dong-form"><label>Email đăng nhập</label>'
    +       '<input type="text" id="cnEmailDN" disabled></div>'
    +     '<div class="dong-form"><label>Số điện thoại (hiển thị cho khách)</label>'
    +       '<input type="text" id="cnSoDienThoai" placeholder="VD: 0912 345 678"></div>'
    +     '<div class="dong-form"><label>Email liên hệ (hiển thị cho khách)</label>'
    +       '<input type="text" id="cnEmailLienHe" placeholder="VD: hoten@sonadezilongthanh.com.vn"></div>'
    +     '<p class="bc-goi-y" style="margin-top:6px">💡 SĐT và email liên hệ sẽ tự điền vào '
    +       'mẫu tin Zalo/brochure khi bạn chia sẻ. Bỏ trống email liên hệ thì dùng email đăng nhập.</p>'
    +   '</div>'
    +   '<div class="thong-bao" id="cnThongBao"></div>'
    +   '<div class="nhom-nut">'
    +     '<button class="nut nut-nhat" onclick="dongHopThoaiCaNhan()">Huỷ</button>'
    +     '<button class="nut nut-chinh" id="cnNutLuu" onclick="luuHopThoaiCaNhan()">💾 Lưu</button>'
    +   '</div>'
    + '</div>';
  div.addEventListener('click', function (e) { if (e.target === div) dongHopThoaiCaNhan(); });
  document.body.appendChild(div);
}

function moThongTinCaNhan() {
  if (!PHIEN_SUA.token || !(NGUOI_DUNG && NGUOI_DUNG.nhanDienDuoc)) {
    alert('Vui lòng đăng nhập để cập nhật thông tin cá nhân.');
    return;
  }
  taoHopThoaiCaNhan();
  document.getElementById('cnHoTen').value       = PHIEN_SUA.hoTen || NGUOI_DUNG.hoTen || '';
  document.getElementById('cnEmailDN').value     = PHIEN_SUA.email || NGUOI_DUNG.email || '';
  document.getElementById('cnSoDienThoai').value = NGUOI_DUNG.soDienThoai || '';
  document.getElementById('cnEmailLienHe').value = NGUOI_DUNG.emailLienHe || '';
  document.getElementById('cnThongBao').textContent = '';
  document.getElementById('hopThoaiCaNhan').classList.remove('an');
}

function dongHopThoaiCaNhan() {
  const el = document.getElementById('hopThoaiCaNhan');
  if (el) el.classList.add('an');
}

function luuHopThoaiCaNhan() {
  const sdt   = document.getElementById('cnSoDienThoai').value.trim();
  const email = document.getElementById('cnEmailLienHe').value.trim();
  const tb    = document.getElementById('cnThongBao');
  const nut   = document.getElementById('cnNutLuu');

function chuyenSangDangKy() {

  tb.className = ''; tb.textContent = '';

    if (o) o.focus();
  }, 80);
}

function chuyenSangDangNhap() {
  document.getElementById('dnKhungDangKy').classList.add('an');
  document.getElementById('dnKhungDangNhap').classList.remove('an');
  setTimeout(function () {
    const o = document.getElementById('dnEmail');
    if (o) o.focus();
  }, 80);
}

function hienManHinhDangNhap() {
  const mt = document.getElementById('manHinhTai');
  if (mt) mt.classList.add('an');

  const tb = document.getElementById('dnThongBao');
  if (tb) { tb.className = ''; tb.textContent = ''; }
  const mk = document.getElementById('dnMatKhau');
  if (mk) mk.value = '';

  chuyenSangDangNhap();
  dnHieuUngVao_();

  // Gợi ý lại email đã dùng lần trước (desktop giữ được localStorage)
  try {
    const emailCu = localStorage.getItem('SZL_EMAIL_DANG_NHAP') || '';
    const oEmail = document.getElementById('dnEmail');
    if (emailCu && oEmail && !oEmail.value) oEmail.value = emailCu;
    // ★ V4.9 — nhớ lựa chọn "Ghi nhớ đăng nhập" của lần trước
    const oGhiNho = document.getElementById('dnGhiNho');
    if (oGhiNho) oGhiNho.checked = (localStorage.getItem('SZL_CHON_GHI_NHO') === '1');
  } catch (e) {}

  // ★ V5.3 — trong vỏ PWA: lấy email cũ từ vỏ, mặc định bật "Ghi nhớ đăng nhập"
  if (VO_PWA.co) {
    const oEmailVo = document.getElementById('dnEmail');
    if (VO_PWA.email && oEmailVo && !oEmailVo.value) oEmailVo.value = VO_PWA.email;
    const oGhiNhoVo = document.getElementById('dnGhiNho');
    if (oGhiNhoVo) oGhiNhoVo.checked = (VO_PWA.chonGhiNho !== '0');
  }

  setTimeout(function () {
    const oEmail = document.getElementById('dnEmail');
    const oMK    = document.getElementById('dnMatKhau');
    if (oEmail && oEmail.value && oMK) oMK.focus();
    else if (oEmail) oEmail.focus();
  }, 120);
}

function anManHinhDangNhap() {
  const el = document.getElementById('manHinhDangNhap');
  if (!el || el.classList.contains('an')) return;

  // ★ V4.7 — không có Motion: ẩn ngay như cũ
  if (!dnCoMotion_()) { el.classList.add('an'); return; }

  const phien = ++DN_PHIEN_HIEU_UNG;
  const hop  = el.querySelector('.dn-hop');
  const logo = el.querySelector('.dn-logo-tron');
  el.style.pointerEvents = 'none';

  Promise.all([
    Motion.animate(logo, { scale: 1.15 }, { duration: 0.3, ease: 'easeOut' }),
    Motion.animate(hop, { opacity: 0, scale: 0.96, y: -12 }, { duration: 0.32, ease: 'easeIn', delay: 0.05 }),
    Motion.animate(el, { opacity: 0 }, { duration: 0.4, ease: 'easeIn', delay: 0.12 })
  ]).then(function () {
    if (phien !== DN_PHIEN_HIEU_UNG) return;   // đã gọi hiện lại giữa chừng
    el.classList.add('an');
    el.style.pointerEvents = '';
  });
}

/* ================================================================
   ★ V4.7 — HIỆU ỨNG MÀN HÌNH ĐĂNG NHẬP BẰNG MOTION
   Trình tự: nền hiện → thẻ nổi lên → logo bật ra (lò xo) → vòng sáng
   xoay + 2 sóng lan → vệt sáng lướt qua logo → chữ & ô nhập hiện lần lượt.
   Ô nhập dùng được ngay, không phải chờ hiệu ứng.
   Không có Motion / bật "giảm chuyển động" → hiện ngay như cũ.
================================================================ */
let DN_PHIEN_HIEU_UNG = 0;

function dnCoMotion_() {
  return !!(window.Motion && Motion.animate &&
            !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches));
}

function dnHieuUngVao_() {
  const el = document.getElementById('manHinhDangNhap');
  DN_PHIEN_HIEU_UNG++;
  el.style.pointerEvents = '';

  if (!dnCoMotion_()) { el.classList.remove('an'); return; }

  const $ = function (s) { return el.querySelector(s); };
  const hop = $('.dn-hop'), logo = $('.dn-logo-tron'), haoQuang = $('.dn-hao-quang'),
        vien = $('.dn-vien-xoay'), loe = $('.dn-loe'), song = el.querySelectorAll('.dn-song');
  const chu = [$('.dn-hop h2'), $('.dn-mota')]
    .concat(Array.prototype.slice.call($('#dnKhungDangNhap').children));

  // Đặt trạng thái xuất phát TRƯỚC khi hiện để không bị chớp 1 khung hình
  [el, hop, logo, haoQuang, vien].concat(chu).forEach(function (n) { if (n) n.style.opacity = '0'; });
  el.classList.remove('an');

  const animate = Motion.animate, stagger = Motion.stagger;
  animate(el, { opacity: [0, 1] }, { duration: 0.45, ease: 'easeOut' });
  animate(hop, { opacity: [0, 1], y: [32, 0], scale: [0.95, 1] },
    { type: 'spring', bounce: 0.2, visualDuration: 0.55, delay: 0.05 });
  animate(logo, { opacity: [0, 1], scale: [0.3, 1], rotate: [-25, 0] },
    { type: 'spring', bounce: 0.45, visualDuration: 0.7, delay: 0.2 });
  animate(haoQuang, { opacity: [0, 1], scale: [0.5, 1] }, { duration: 0.7, ease: 'easeOut', delay: 0.3 });
  animate(vien, { opacity: [0, 1] }, { duration: 0.6, ease: 'easeOut', delay: 0.55 });
  animate(song, { opacity: [0.6, 0], scale: [1, 1.85] },
    { duration: 1.2, ease: 'easeOut', delay: stagger(0.3, { startDelay: 0.45 }) });
  animate(loe, { x: ['-140%', '260%'] }, { duration: 0.9, ease: 'easeInOut', delay: 0.8 });
  animate(chu, { opacity: [0, 1], y: [14, 0] },
    { duration: 0.4, ease: 'easeOut', delay: stagger(0.045, { startDelay: 0.4 }) });
}

/** Rung nhẹ thẻ đăng nhập khi có lỗi */
function dnRung_() {
  if (!dnCoMotion_()) return;
  const hop = document.querySelector('#manHinhDangNhap .dn-hop');
  if (hop) Motion.animate(hop, { x: [0, -10, 10, -6, 6, -2, 0] }, { duration: 0.45, ease: 'easeOut' });
}

function moKhoTaoLop_(W, H, CX, CY, THANG) {
  const LON = 104 * THANG, LOGO = 72 * THANG;
  let vach = '';
  for (let i = 0; i < 72; i++) {
    const dai = i % 6 === 0, a = i * 5 * Math.PI / 180, r1 = dai ? 60 : 64, r2 = 70;
    vach += '<line x1="' + (Math.sin(a) * r1).toFixed(1) + '" y1="' + (-Math.cos(a) * r1).toFixed(1)
         +  '" x2="' + (Math.sin(a) * r2).toFixed(1) + '" y2="' + (-Math.cos(a) * r2).toFixed(1)
         +  '" stroke="' + (dai ? '#ffffff' : '#9fc0ea') + '" stroke-width="' + (dai ? 2 : 1) + '"/>';
  }
  let hat = '';
  for (let j = 0; j < 20; j++) hat += '<span class="mk-hat' + (j % 5 === 0 ? ' vang' : '') + '"></span>';
  const khoiLogo = function (lop, duong) {
    return '<svg class="mk-khoi ' + lop + '" viewBox="0.0 0.0 275.0 200.0"><path fill="#0B4696" d="' + duong + '"/></svg>';
  };

  document.body.insertAdjacentHTML('beforeend',
      '<style id="moKhoCss">'
    + '#moKho{position:fixed;inset:0;z-index:10030;overflow:hidden;contain:strict}'
    + '#moKho .mk-cua{position:absolute;visibility:hidden;background-color:#08305f;will-change:transform,opacity}'
    + '#moKho .mk-khe{position:absolute;left:50%;height:3px;visibility:hidden;will-change:transform,opacity;'
    +   'background:linear-gradient(90deg,transparent,#bcd6ff 42%,#fff 50%,#bcd6ff 58%,transparent)}'
    /* Ánh sáng: khung 512px phóng lớn bằng GPU, không phải vẽ lại mỗi khung hình */
    + '#moKho .mk-sang,#moKho .mk-tia{position:absolute;left:0;top:0;width:512px;height:512px;border-radius:50%;'
    +   'visibility:hidden;pointer-events:none;will-change:transform,opacity}'
    + '#moKho .mk-sang{background:radial-gradient(circle,#fff 0,#dbe9ff 28%,rgba(170,205,255,.5) 50%,rgba(255,226,170,.12) 62%,rgba(255,226,170,0) 70%)}'
    + '#moKho .mk-tia{background:repeating-conic-gradient(rgba(255,255,255,.42) 0 7deg,transparent 7deg 22deg);'
    +   '-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%)}'
    + '#moKho .mk-hero{position:absolute;left:0;top:0;width:' + LON + 'px;height:' + LON + 'px;will-change:transform}'
    + '#moKho .mk-dia{position:absolute;inset:0;border-radius:50%;background:#fff;will-change:opacity}'
    + '#moKho .mk-anh{position:absolute;inset:0;width:100%;height:100%;padding:' + (13 * THANG) + 'px;box-sizing:border-box}'
    + '#moKho .mk-vong{position:absolute;left:' + (-22 * THANG) + 'px;top:' + (-22 * THANG) + 'px;'
    +   'width:' + (148 * THANG) + 'px;height:' + (148 * THANG) + 'px;opacity:0;will-change:transform,opacity}'
    + '#moKho .mk-dau{position:absolute;left:' + (16 * THANG) + 'px;top:' + (26 * THANG) + 'px;'
    +   'width:' + LOGO + 'px;height:' + (LOGO * 200 / 275) + 'px;opacity:0;will-change:transform,opacity}'
    + '#moKho .mk-khoi{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;will-change:transform}'
    + '#moKho .mk-tb{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:#cfdcee;opacity:0}'
    + '#moKho .mk-de{position:absolute;left:0;top:0;border-radius:10px;background:#fff;visibility:hidden;will-change:transform,opacity}'
    + '#moKho .mk-hat{position:absolute;width:12px;height:8px;background:#dbe9ff;visibility:hidden;will-change:transform,opacity}'
    + '#moKho .mk-hat.vang{background:#f2cf86}'
    + '</style>'
    + '<div id="moKho" aria-hidden="true">'
    +   '<div class="mk-sang"></div><div class="mk-tia"></div>'
    +   '<div class="mk-cua" id="mkCuaA"></div><div class="mk-cua" id="mkCuaB"></div>'
    +   '<div class="mk-khe"></div>'
    +   '<div class="mk-de"></div>'
    +   hat
    +   '<div class="mk-hero">'
    +     '<svg class="mk-vong" viewBox="-74 -74 148 148">' + vach
    +       '<circle r="56" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>'
    +       '<path d="M0 -74 L5 -64 L-5 -64Z" fill="#f2cf86"/></svg>'
    +     '<div class="mk-dia"></div><img class="mk-anh" alt="">'
    +     '<div class="mk-dau">' + khoiLogo('mk-a', MO_KHO_LOGO_A) + khoiLogo('mk-b', MO_KHO_LOGO_B) + '</div>'
    +   '</div>'
    +   '<div class="mk-tb">Đang tải dữ liệu…</div>'
    + '</div>');

  /* Hai cánh cửa: 2 tấm chữ nhật xoay theo độ nghiêng của logo, không dùng clip-path */
  const cheo = Math.hypot(W, H), dai = cheo + 60, cao = cheo * 0.56 + 30;
  const nen = function (tamY) {
    return 'repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),'
         + 'radial-gradient(circle at 50% ' + tamY + ',#0f4a8e 0,#08305f 320px,#051f40 760px)';
  };
  gsap.set('#mkCuaA', { left: CX - dai / 2, top: CY - cao, width: dai, height: cao + 1, backgroundImage: nen('100%'),
                        transformOrigin: '50% 100%', rotation: -49.6, force3D: true });
  gsap.set('#mkCuaB', { left: CX - dai / 2, top: CY, width: dai, height: cao, backgroundImage: nen('0%'),
                        transformOrigin: '50% 0%', rotation: -49.6, force3D: true });
  MO_KHO.diCua = cao + 20;
}

/**
 * Bắt đầu hiệu ứng. Trả về true nếu chạy được, false để đi đường cũ.
 * tuManHinhTai = true: vào bằng phiên đã ghi nhớ, logo xuất phát từ màn hình tải.
 */
function moKhoBatDau_(tuManHinhTai) {
  if (!moKhoDuocPhep_() || MO_KHO.chay) return false;
  const dn = document.getElementById('manHinhDangNhap');
  const mt = document.getElementById('manHinhTai');
  const nguon = tuManHinhTai ? mt && mt.querySelector('.logo-tai') : dn && dn.querySelector('.dn-logo-tron');
  if (!nguon) return false;

  const W = window.innerWidth, H = window.innerHeight, CX = W / 2, CY = H / 2 - 24;
  const THANG = Math.min(2.5, (W - 16) / 165), LON = 104 * THANG;
  moKhoTaoLop_(W, H, CX, CY, THANG);
  MO_KHO.chay = true; MO_KHO.sanSang = false; MO_KHO.tl = [];
  MO_KHO.W = W; MO_KHO.H = H; MO_KHO.CX = CX; MO_KHO.CY = CY; MO_KHO.THANG = THANG;
  if (dn) dn.style.pointerEvents = 'none';

  const lop = document.getElementById('moKho'), $ = function (s) { return lop.querySelector(s); };
  const hero = $('.mk-hero'), dau = $('.mk-dau'), cua = [$('#mkCuaA'), $('#mkCuaB')];
  const r = nguon.getBoundingClientRect();
  $('.mk-anh').src = tuManHinhTai ? nguon.src : dn.querySelector('.dn-logo').src;
  gsap.set(hero, { x: r.left + r.width / 2 - LON / 2, y: r.top + r.height / 2 - LON / 2,
                   scale: r.width / LON, force3D: true });
  gsap.set(dau, { transformOrigin: '50% 50%', force3D: true });
  gsap.set($('.mk-tb'), { top: CY + 74 * THANG + 20 });

  const t = gsap.timeline({ defaults: { ease: 'power2.inOut' }, onComplete: moKhoCho_ });
  if (tuManHinhTai) {
    t.set(cua, { visibility: 'visible', opacity: 0 }, 0)
     .to(cua, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0)
     .add(function () { mt.classList.add('an'); }, 0.42);
  } else {
    const khung = dn.querySelector('.dn-logo-khung'), hop = dn.querySelector('.dn-hop');
    const con = Array.prototype.slice.call(hop.children).filter(function (n) { return n !== khung; });
    gsap.set(khung, { visibility: 'hidden' });
    t.to(con, { opacity: 0, y: 8, duration: 0.28, stagger: 0.012, ease: 'power1.in' }, 0)
     .to(hop, { opacity: 0, duration: 0.3 }, 0.1)
     .set(cua, { visibility: 'visible', opacity: 0 }, 0.1)
     .to(cua, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0.1)
     .add(function () { dn.classList.add('an'); }, 0.62);
  }
  t.to(hero, { x: CX - LON / 2, y: CY - LON / 2, scale: 1, duration: 0.7 }, 0.12)
   .to($('.mk-anh'), { opacity: 0, duration: 0.25 }, 0.12)
   .to(dau, { opacity: 1, duration: 0.25 }, 0.12)
   .to(dau, { rotation: 720, duration: 1.15, ease: 'power3.inOut' }, 0.2)
   .to($('.mk-vong'), { opacity: 1, duration: 0.4 }, 0.45)
   .to($('.mk-tb'), { opacity: 1, duration: 0.25 }, 0.95);
  MO_KHO.tl.push(t);
  return true;
}

/** Quay khoá cho đến khi dữ liệu sẵn sàng, hết một vòng mới kiểm tra lại */
function moKhoCho_() {
  if (!MO_KHO.chay) return;
  if (MO_KHO.sanSang) {
    // Nhường 2 khung hình để trình duyệt vẽ xong app dưới cửa rồi mới mở
    requestAnimationFrame(function () { requestAnimationFrame(moKhoMoCua_); });
    return;
  }
  const lop = document.getElementById('moKho');
  const vong = lop.querySelector('.mk-vong'), dau = lop.querySelector('.mk-dau');
  const buoc = function (t, goc, tg) {
    return t.to(vong, { rotation: (goc > 0 ? '+=' : '-=') + Math.abs(goc), duration: tg, ease: 'back.out(2)' })
            .to(dau, { rotation: (goc > 0 ? '-=' : '+=') + Math.abs(goc), duration: tg, ease: 'back.out(2)' }, '<');
  };
  const t = gsap.timeline({ onComplete: moKhoCho_ });
  buoc(t, 150, 0.55); buoc(t, -110, 0.5); buoc(t, -40, 0.4);
  MO_KHO.tl.push(t);
}

function moKhoMoCua_() {
  if (!MO_KHO.chay) return;
  const lop = document.getElementById('moKho'), $ = function (s) { return lop.querySelector(s); };
  const W = MO_KHO.W, H = MO_KHO.H, CX = MO_KHO.CX, CY = MO_KHO.CY, THANG = MO_KHO.THANG;
  const hero = $('.mk-hero'), dau = $('.mk-dau'), khe = $('.mk-khe'), sang = $('.mk-sang'), tia = $('.mk-tia');
  const a = $('.mk-a'), b = $('.mk-b'), de = $('.mk-de');
  const logoApp = document.querySelector('.thuong-hieu .logo-cty');

  /* Điểm đến: hình logo nằm ở phần trên của ảnh logo trên thanh tiêu đề */
  const r = logoApp ? logoApp.getBoundingClientRect() : { left: 24, top: 12, width: 44, height: 44 };
  const dx = r.left + r.width / 2 - CX, dy = r.top + r.height * 0.34 - CY;
  const k = (r.width * 0.59) / (72 * THANG), cheo = Math.hypot(W, H);

  gsap.set(khe, { width: cheo * 1.3, marginLeft: -cheo * 0.65, top: CY, rotation: -49.6, scaleX: 0, force3D: true });
  [sang, tia].forEach(function (e) {
    gsap.set(e, { x: CX - 256, y: CY - 256, scale: cheo * 1.15 / 512, opacity: 0, visibility: 'visible', force3D: true });
  });
  gsap.set(de, { x: r.left, y: r.top, width: r.width, height: r.height, scale: 0.4, opacity: 0, visibility: 'visible', force3D: true });
  gsap.set([a, b], { force3D: true });
  if (logoApp) gsap.set(logoApp, { opacity: 0 });

  const t = gsap.timeline({ onComplete: moKhoKetThuc_ });
  t.to(hero, { scale: 1.06, duration: 0.1, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0)
   .to($('.mk-tb'), { opacity: 0, duration: 0.15 }, 0)
   .addLabel('khe', 0.28)
   .set(khe, { visibility: 'visible' }, 'khe')
   .to(khe, { scaleX: 1, duration: 0.26, ease: 'power2.out' }, 'khe')
   .addLabel('mo', 'khe+=.34')
   .to(khe, { scaleY: 9, opacity: 0, duration: 0.5, ease: 'power2.out' }, 'mo')
   .to(sang, { opacity: 0.9, duration: 0.35, ease: 'sine.out' }, 'mo-=.06')
   .to(tia, { opacity: 0.8, rotation: 24, duration: 0.6, ease: 'sine.out' }, 'mo-=.06')
   .to('#mkCuaA', { x: -0.761 * MO_KHO.diCua, y: -0.648 * MO_KHO.diCua, duration: 1.1, ease: 'power2.inOut', force3D: true }, 'mo')
   .to('#mkCuaB', { x: 0.761 * MO_KHO.diCua, y: 0.648 * MO_KHO.diCua, duration: 1.1, ease: 'power2.inOut', force3D: true }, 'mo')
   .to($('.mk-dia'), { opacity: 0, duration: 0.25, ease: 'sine.out' }, 'mo')
   .to($('.mk-vong'), { opacity: 0, scale: 1.4, duration: 0.4, ease: 'sine.out' }, 'mo')
   /* Logo bay vòng cung về thanh tiêu đề: x và y khác nhịp tạo đường cong */
   .to(dau, { x: dx, duration: 1.2, ease: 'sine.inOut', force3D: true }, 'mo')
   .to(dau, { y: dy, duration: 1.2, ease: 'power2.out', force3D: true }, 'mo')
   .to(dau, { scale: k, duration: 1.2, ease: 'sine.inOut', force3D: true }, 'mo')
   .to(a, { x: -46, y: -8, duration: 0.55, ease: 'sine.out' }, 'mo')
   .to(b, { x: 46, y: 8, duration: 0.55, ease: 'sine.out' }, 'mo')
   .to(a, { x: 0, y: 0, duration: 0.65, ease: 'sine.inOut' }, 'mo+=.55')
   .to(b, { x: 0, y: 0, duration: 0.65, ease: 'sine.inOut' }, 'mo+=.55')
   .to(de, { scale: 1, opacity: 1, duration: 0.35, ease: 'sine.out' }, 'mo+=.85')
   .to(sang, { opacity: 0, duration: 0.6, ease: 'sine.in' }, 'mo+=.6')
   .to(tia, { opacity: 0, rotation: 44, duration: 0.6, ease: 'sine.in' }, 'mo+=.6');

  lop.querySelectorAll('.mk-hat').forEach(function (h, i) {
    const goc = (i * 137.5) * Math.PI / 180, xa = Math.min(W, H) * (0.28 + ((i * 7) % 11) / 18);
    gsap.set(h, { left: CX, top: CY, skewX: -40, force3D: true });
    t.set(h, { visibility: 'visible', opacity: 1, scale: 0.5 + ((i * 3) % 7) / 7 }, 'mo+=.05')
     .to(h, { x: Math.cos(goc) * xa, y: Math.sin(goc) * xa, rotation: i * 40,
              duration: 0.9 + (i % 5) * 0.08, ease: 'power2.out' }, 'mo+=.05')
     .to(h, { opacity: 0, duration: 0.35 }, 'mo+=' + (0.55 + (i % 4) * 0.12));
  });

  /* Logo chạm đích: nhịp nẩy nhẹ trên thanh tiêu đề */
  t.add(function () {
    if (logoApp) gsap.fromTo(logoApp, { opacity: 1, scale: 1 },
      { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: 'sine.inOut', clearProps: 'all' });
    lop.style.pointerEvents = 'none';
    gsap.set(de, { visibility: 'hidden' });
    gsap.set(hero, { visibility: 'hidden' });
  }, 'mo+=1.2');
  MO_KHO.tl.push(t);
}

/** Dữ liệu đã nạp xong: chờ ảnh trong app giải mã (tối đa 1,2 giây) rồi cho phép mở cửa */
function moKhoDuLieuSanSang_() {
  if (!MO_KHO.chay) return;
  clearTimeout(MO_KHO.an_toan);
  MO_KHO.an_toan = setTimeout(moKhoKetThuc_, 9000);   // chốt an toàn: không để lớp phủ che kẹt app
  const anh = Array.prototype.slice.call(document.querySelectorAll('#ungDung img'))
    .filter(function (i) { return i.src && i.decode; })
    .map(function (i) { return i.decode().catch(function () {}); });
  const bao = function () { MO_KHO.sanSang = true; };
  Promise.race([Promise.all(anh), new Promise(function (ok) { setTimeout(ok, 1200); })]).then(bao, bao);
}

/** Trả màn hình đăng nhập về nguyên trạng để lần đăng xuất sau dùng lại */
function moKhoDonDep_() {
  clearTimeout(MO_KHO.an_toan);
  MO_KHO.tl.forEach(function (t) { t.kill(); });
  MO_KHO.tl = [];
  MO_KHO.chay = false;
  const lop = document.getElementById('moKho'), css = document.getElementById('moKhoCss');
  if (lop) lop.remove();
  if (css) css.remove();
  const dn = document.getElementById('manHinhDangNhap');
  if (dn) {
    dn.style.pointerEvents = '';
    const hop = dn.querySelector('.dn-hop');
    gsap.set(hop, { clearProps: 'opacity' });
    gsap.set(hop.children, { clearProps: 'opacity,transform,visibility' });
  }
  const logoApp = document.querySelector('.thuong-hieu .logo-cty');
  if (logoApp && !gsap.isTweening(logoApp)) gsap.set(logoApp, { clearProps: 'opacity,transform' });
}

function moKhoKetThuc_() {
  if (!MO_KHO.chay) return;
  moKhoDonDep_();
}

/** Lỗi tải dữ liệu: gỡ lớp phủ, hiện màn hình tải để báo lỗi như cũ */
function moKhoHuy_() {
  if (!MO_KHO.chay) return;
  const dn = document.getElementById('manHinhDangNhap');
  if (dn) dn.classList.add('an');
  moKhoDonDep_();
  const mt = document.getElementById('manHinhTai');
  if (mt) mt.classList.remove('an');
}

/** Gửi yêu cầu đăng nhập lên server */
function guiDangNhap() {
  const email = document.getElementById('dnEmail').value.trim();
  const mk    = document.getElementById('dnMatKhau').value;
  const tb    = document.getElementById('dnThongBao');
  const nut   = document.getElementById('dnNutDangNhap');
  const oGN   = document.getElementById('dnGhiNho');
  const ghiNho = !!(oGN && oGN.checked);                 // ★ V4.9

  tb.className = '';
  if (!email) { tb.textContent = '✕ Vui lòng nhập email tài khoản.'; dnRung_(); return; }
  if (!mk)    { tb.textContent = '✕ Vui lòng nhập mật khẩu.'; dnRung_(); return; }

  nut.disabled = true;
  nut.textContent = 'Đang kiểm tra…';
  tb.textContent = '';

  google.script.run
    .withSuccessHandler(function (kq) {
      nut.disabled = false;
      nut.textContent = 'Đăng nhập';

      try {
        localStorage.setItem('SZL_EMAIL_DANG_NHAP', kq.email);
        localStorage.setItem('SZL_CHON_GHI_NHO', ghiNho ? '1' : '0');
      } catch (e) {}
      VO_PWA.email = kq.email;                                // ★ V5.3
      VO_PWA.chonGhiNho = ghiNho ? '1' : '0';
      guiVoPwa_({ lenh: 'luu-tuy-chon', email: kq.email, chon: ghiNho ? '1' : '0' });

      PHIEN_SUA = {
        token : kq.token,
        email : kq.email,
        hoTen : kq.hoTen,
        vaiTro: kq.vaiTro
      };
      // ★ V4.9 — có tick "Ghi nhớ" → lưu phiên lâu dài trên thiết bị; không tick → xoá
      if (ghiNho) ghiNhoPhien_(); else xoaGhiNhoPhien_();
      luuPhienSua();

      // Tài khoản vừa được quản trị đặt lại mật khẩu → buộc đổi ngay
      if (kq.buocDoiMatKhau) {
        taiDuLieu();
        setTimeout(function () {
          alert('Tài khoản của bạn đang dùng mật khẩu tạm do quản trị cấp.\n'
              + 'Vui lòng đổi mật khẩu ngay.');
          moDoiMatKhau(true);
        }, 900);
        return;
      }
      moKhoBatDau_();   // ★ V4.10
      taiDuLieu();
    })
    .withFailureHandler(function (loi) {
      nut.disabled = false;
      nut.textContent = 'Đăng nhập';
      tb.className = '';
      tb.textContent = '✕ ' + loi.message;
      dnRung_();
    })
    .dangNhapTaiKhoan(email, mk, ghiNho);
}

/** Gửi yêu cầu đăng ký tài khoản mới */
function guiDangKy() {
  const hoTen = document.getElementById('dkHoTen').value.trim();
  const email = document.getElementById('dkEmail').value.trim();
  const mk    = document.getElementById('dkMatKhau').value;
  const mk2   = document.getElementById('dkMatKhau2').value;
  const tb    = document.getElementById('dkThongBao');
  const nut   = document.getElementById('dkNutDangKy');

  tb.className = '';
  if (hoTen.length < 3) { tb.textContent = '✕ Vui lòng nhập họ tên (tối thiểu 3 ký tự).'; return; }
  if (!email)           { tb.textContent = '✕ Vui lòng nhập email.'; return; }
  if (mk.length < 6)    { tb.textContent = '✕ Mật khẩu phải có tối thiểu 6 ký tự.'; return; }
  if (mk !== mk2)       { tb.textContent = '✕ Hai lần nhập mật khẩu chưa khớp nhau.'; return; }

  nut.disabled = true;
  nut.textContent = 'Đang gửi…';
  tb.textContent = '';

  google.script.run
    .withSuccessHandler(function (kq) {
      nut.disabled = false;
      nut.textContent = 'Gửi yêu cầu đăng ký';
      tb.className = 'ok';
      tb.textContent = '✓ ' + (kq && kq.thongBao ? kq.thongBao : 'Đã gửi yêu cầu đăng ký.');

      document.getElementById('dkMatKhau').value  = '';
      document.getElementById('dkMatKhau2').value = '';

      // Chuyển sẵn email sang màn hình đăng nhập cho tiện
      const oEmail = document.getElementById('dnEmail');
      if (oEmail) oEmail.value = email;
    })
    .withFailureHandler(function (loi) {
      nut.disabled = false;
      nut.textContent = 'Gửi yêu cầu đăng ký';
      tb.className = '';

/** Khôi phục phiên trong cùng tab trình duyệt (nếu có) */
function khoiPhucPhienSua() {
  try {
    const s = sessionStorage.getItem('SZL_PHIEN_SUA');
    if (s) {
      PHIEN_SUA = JSON.parse(s);
      PHIEN_SUA.token  = PHIEN_SUA.token  || '';
      PHIEN_SUA.email  = PHIEN_SUA.email  || '';
      PHIEN_SUA.hoTen  = PHIEN_SUA.hoTen  || '';
      PHIEN_SUA.vaiTro = PHIEN_SUA.vaiTro || '';
      // Phiên cũ V3.x không có email nhưng có token → buộc đăng nhập lại
      if (PHIEN_SUA.token && !PHIEN_SUA.email) {
        PHIEN_SUA = { token: '', email: '', hoTen: '', vaiTro: '' };
      }
    }
  } catch (e) { /* trình duyệt chặn sessionStorage — bỏ qua */ }

  // ★ V4.9 — Tab mới chưa có phiên → lấy phiên "Ghi nhớ đăng nhập" (nếu còn hạn)
  if (!PHIEN_SUA.vaiTro) {
    try {
      const g = JSON.parse(localStorage.getItem(KHOA_GHI_NHO) || 'null');
      if (g && g.token && g.email && g.vaiTro && hanToken_(g.token) > Date.now()) {
        PHIEN_SUA = { token: g.token, email: g.email, hoTen: g.hoTen || '', vaiTro: g.vaiTro };
        sessionStorage.setItem('SZL_PHIEN_SUA', JSON.stringify(PHIEN_SUA));
      } else if (g) {
        xoaGhiNhoPhien_();                                // hết hạn → xoá, bắt đăng nhập lại
      }
    } catch (e) { /* trình duyệt chặn localStorage — bỏ qua */ }
  }
  henGioHetPhien_();
}

function luuPhienSua() {
  try {
    sessionStorage.setItem('SZL_PHIEN_SUA', JSON.stringify(PHIEN_SUA));
  } catch (e) { /* bỏ qua */ }

  // ★ V4.9 — đồng bộ phiên ghi nhớ (đổi mật khẩu → token mới; bị thu hồi → xoá)
  if (coGhiNhoPhien_()) {
    if (PHIEN_SUA.token) ghiNhoPhien_(); else xoaGhiNhoPhien_();
  }
  henGioHetPhien_();
}


/***********************************************************************
 * ★ V4.9 — GHI NHỚ ĐĂNG NHẬP (localStorage, hết hạn 23h thứ Sáu)
 *   Hạn nằm trong token và do server ký → không sửa tay được.
 ***********************************************************************/
const KHOA_GHI_NHO = 'SZL_PHIEN_GHI_NHO';
let HEN_GIO_HET_PHIEN = null;

/** Đọc mốc hết hạn (ms) nằm ở phần giữa token: email.hetHan.chuKy */
function hanToken_(token) {
  const p = String(token || '').split('.');
  return p.length === 3 ? (Number(p[1]) || 0) : 0;
}

function ghiNhoPhien_() {
  try { localStorage.setItem(KHOA_GHI_NHO, JSON.stringify(PHIEN_SUA)); } catch (e) {}
  if (VO_PWA.co) {                                        // ★ V5.3
    VO_PWA.coPhien = true;
    guiVoPwa_({ lenh: 'luu-phien', phien: PHIEN_SUA });
  }
}

function xoaGhiNhoPhien_() {
  try { localStorage.removeItem(KHOA_GHI_NHO); } catch (e) {}
  VO_PWA.coPhien = false;                                 // ★ V5.3
  guiVoPwa_({ lenh: 'xoa-phien' });
}

function coGhiNhoPhien_() {
  if (VO_PWA.coPhien) return true;                        // ★ V5.3
  try { return !!localStorage.getItem(KHOA_GHI_NHO); } catch (e) { return false; }
}

/** Đến hạn token → tự đăng xuất (kể cả khi đang mở app qua 23h thứ Sáu) */
function henGioHetPhien_() {
  clearTimeout(HEN_GIO_HET_PHIEN);
  const han = hanToken_(PHIEN_SUA.token);
  if (!han) return;
  const conLai = han - Date.now();
  if (conLai <= 0) { setTimeout(hetPhienDangXuat_, 0); return; }
  HEN_GIO_HET_PHIEN = setTimeout(hetPhienDangXuat_, Math.min(conLai, 2147000000));
}

function hetPhienDangXuat_() {
  if (!PHIEN_SUA.token || hanToken_(PHIEN_SUA.token) > Date.now()) return;
  dangXuat(true);
  alert('Phiên đăng nhập đã hết hạn (23h thứ Sáu hằng tuần).\nVui lòng đăng nhập lại.');
}

// Máy ngủ/khoá màn hình làm trễ setTimeout → kiểm tra lại khi người dùng quay lại tab
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') hetPhienDangXuat_();
});

  const moi  = document.getElementById('dmkMoi').value;

  const tb   = document.getElementById('dmkThongBao');

  if (moi !== moi2)    { tb.textContent = '✕ Hai lần nhập mật khẩu mới chưa khớp.'; return; }
  if (moi === cu)      { tb.textContent = '✕ Mật khẩu mới phải khác mật khẩu hiện tại.'; return; }

  nut.disabled = true;

let QLTK_DS = [];

function veBangTaiKhoan(ds) {
  QLTK_DS = ds || [];

  if (!ds || ds.length === 0) {
    than.innerHTML = '<tr><td style="padding:20px;text-align:center;color:#8b96a8">'

  const TRANG_THAI = ['ChoDuyet', 'HoatDong', 'Khoa'];

  let html = '<tr><th>Họ tên / Email</th><th>Vai trò</th><th>Trạng thái</th>'
           + '<th>Đăng ký</th><th>Đăng nhập cuối</th><th>Thao tác</th></tr>';

  ds.forEach(function (tk, i) {
    const choDuyet = (tk.trangThai === 'ChoDuyet');
    const eMail = _escHTML(tk.email);

    let optVT = '';
    VAI_TRO.forEach(function (v) {
      optVT += '<option value="' + v + '"'
             + (tk.vaiTro === v ? ' selected' : '') + '>' + v + '</option>';
    });
    if (VAI_TRO.indexOf(tk.vaiTro) < 0) {
      optVT = '<option value="" selected>— chưa cấp —</option>' + optVT;
    }

    TRANG_THAI.forEach(function (v) {
      optTT += '<option value="' + v + '"'
             + (tk.trangThai === v ? ' selected' : '') + '>' + v + '</option>';

          + '<td><select class="qltk-o" id="qltkTT' + i + '">' + optTT + '</select></td>'

/** Đổi MaCum -> TenCum để hiển thị trong danh sách chọn */
function _tenCum(maCum) {
  const c = (DU_LIEU.cum || []).filter(function (x) { return x.MaCum === maCum; })[0];
  return (c && c.TenCum) || (maCum === MA_CUM_KCN ? 'Lô đất KCN' : maCum);   // ★ V5.2
}

/** Đổi email cán bộ -> Họ tên để hiển thị trong danh sách chọn (dạng thô, chưa escape —
 *  capNhatOChon() sẽ tự escape). Khác với tenCanBo() vốn trả HTML đã escape sẵn.
 *  Nếu tài khoản không có DU_LIEU.danhSachCanBo (vd. Khách) thì giữ nguyên email. */
function _tenCanBoLoc(email) {
  const ds = (DU_LIEU && DU_LIEU.danhSachCanBo) ? DU_LIEU.danhSachCanBo : [];
  const cb = ds.filter(function (x) { return x.email === email; })[0];
  return (cb && cb.hoTen) || email;
}

/***********************************************************************
 * ★ V5.2 — TÌM KIẾM KHÔNG DẤU, THEO TỪNG TỪ, TRÊN NHIỀU TRƯỜNG
 ***********************************************************************/
function boDau_(s) {
  return String(s === null || s === undefined ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[đĐ]/g, 'd').toLowerCase();
}

/** Các trường được tìm; nhãn dùng cho cột "Khớp theo" */
const COT_TIM_KIEM = [
  { nhan: 'Mã',                lay: function (nx) { return nx.MaDonVi; } },
  { nhan: 'Tên nhà xưởng',     lay: function (nx) { return nx.TenNhaXuong; } },
  { nhan: 'Khách thuê',        lay: function (nx) { return nx.KhachThue; } },
  { nhan: 'Người đại diện',    lay: function (nx) { return nx.NguoiDaiDien; } },
  { nhan: 'Ngành nghề, sản phẩm', lay: function (nx) { return docNganhNghe(nx); } },
  { nhan: 'Quốc tịch',         lay: function (nx) { return nx.QuocTich; } },
  { nhan: 'Hợp đồng — Số',     lay: function (nx) { return nx.SoHopDong; } },
  { nhan: 'Bản thỏa thuận — Số', lay: function (nx) { return nx['BanThoaThuan - So']; } },
  { nhan: 'Lô đất thuê',       lay: function (nx) { return nx.LoDatThue; } },
  { nhan: 'Giấy chứng nhận đầu tư',       lay: function (nx) { return nx.GiayCNDT; } },
  { nhan: 'Giấy chứng nhận doanh nghiệp', lay: function (nx) { return nx.GiayCNDN; } },
  { nhan: 'Ghi chú',           lay: function (nx) { return nx.GhiChu; } }
];

/** Chuỗi tìm kiếm của 1 dòng; chỉ chuẩn hoá lại khi dữ liệu dòng thay đổi */
function chuoiTimKiem_(nx) {
  const goc = COT_TIM_KIEM.map(function (c) { return c.lay(nx) || ''; }).join('\n');
  if (nx._tkGoc !== goc) { nx._tkGoc = goc; nx._tk = boDau_(goc); }
  return nx._tk;
}

/** Vị trí của từ trong chuỗi đã chuẩn hoá, -1 nếu không có.
 *  Tìm nhiều từ: mỗi từ phải là ĐẦU một từ trong dữ liệu ("det" không khớp "HIDETOSHI"),
 *  trừ từ có chữ số (mã, số hợp đồng) vẫn được tìm ở giữa chuỗi. */
function viTriTu_(chuoi, tu, nhieuTu) {
  let vt = chuoi.indexOf(tu);
  if (!nhieuTu || /\d/.test(tu)) return vt;
  while (vt >= 0) {
    if (vt === 0 || !/[a-z0-9]/.test(chuoi.charAt(vt - 1))) return vt;
    vt = chuoi.indexOf(tu, vt + 1);
  }
  return -1;
}

/** Mã đơn vị cần lọc CHÍNH XÁC khi đi từ Bản đồ sang Tra cứu */
let LOC_MA_CHINH_XAC = '';

/** ★ V5.2 — Đọc số từ ô có thể ghi 20,297 | 2419,2 | 2.372,72 | 2.372 */
function docSoLinhHoat_(raw) {
  if (typeof raw === 'number') return raw;
  let s = String(raw === null || raw === undefined ? '' : raw).replace(/\s/g, '');
  const m = s.match(/^\d[\d.,]*/);
  if (!m) return null;
  s = m[0].replace(/[.,]$/, '');
  const cuoiCham = s.lastIndexOf('.'), cuoiPhay = s.lastIndexOf(',');
  if (cuoiCham >= 0 && cuoiPhay >= 0) {          // có cả 2 dấu: dấu đứng sau là thập phân
    const thapPhan = cuoiCham > cuoiPhay ? '.' : ',';
    s = s.split(thapPhan === '.' ? ',' : '.').join('').replace(thapPhan, '.');
  } else if (cuoiPhay >= 0 || cuoiCham >= 0) {   // 1 loại dấu: đúng 3 số phía sau = phân cách nghìn
    const dau = cuoiPhay >= 0 ? ',' : '.';
    const phan = s.split(dau);
    s = (phan.length > 2 || phan[1].length === 3) ? phan.join('') : phan.join('.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/** Diện tích đại diện dùng cho bộ lọc khoảng m² */
function soM2(nx) {
  return docSoLinhHoat_(nx.DienTichXuong_m2 || nx['Tong DienTichDatThue (m2)'] || '');
}

/* ---------- Đọc toàn bộ giá trị đang nhập trên thanh lọc ---------- */
function docBoLoc() {
  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value : '';
  }
  const chon = {};
  O_LOC_CHON.forEach(function (c) { chon[c.id] = val(c.id); });

  const tuKhoa = boDau_(val('oTimKiem')).trim();
  const hetHan = val('locHetHan');
  let mocHan = null;
  if (hetHan && hetHan !== 'da-het') {
    mocHan = homNay_();
    mocHan.setMonth(mocHan.getMonth() + Number(hetHan));
  }

  return {
    tuKhoa   : tuKhoa,
    dsTu     : tuKhoa ? tuKhoa.split(/\s+/) : [],
    maChinhXac: (LOC_MA_CHINH_XAC && val('oTimKiem') === LOC_MA_CHINH_XAC) ? LOC_MA_CHINH_XAC : '',
    hetHan   : hetHan,
    mocHan   : mocHan,
    nganhNghe: boDau_(val('locNganhNghe')).trim(),
    dtMin    : parseFloat(val('locDTMin')),
    dtMax    : parseFloat(val('locDTMax')),
    chon     : chon
  };
}


/* ---------- Vị từ lọc dùng chung ---------- */
function khopBoLoc(nx, L, boQuaId) {

  // 1. Từ khoá chung (★ V5.2: không dấu, đủ mọi từ, trên nhiều trường)
  if (L.maChinhXac) {
    if (String(nx.MaDonVi).trim() !== L.maChinhXac) return false;
  } else if (L.dsTu.length) {
    const chuoi = chuoiTimKiem_(nx);
    for (let i = 0; i < L.dsTu.length; i++) {
      if (viTriTu_(chuoi, L.dsTu[i], L.dsTu.length > 1) < 0) return false;
    }
  }

  // ★ V5.2 — Thời hạn hợp đồng
  if (L.hetHan) {
    const han = phanTichHanThue_(nx);
    if (!han) return false;
    const nay = homNay_();
    if (L.hetHan === 'da-het') {
      if (han.ngay >= nay) return false;
    } else if (han.ngay < nay || han.ngay > L.mocHan) {
      return false;
    }
  }

  // 2. Ngành nghề / sản phẩm (tìm gần đúng)
  if (L.nganhNghe) {
    const nn = boDau_((nx.NganhNghe_SanPham || '') + ' ' + (nx.NganhNghe || ''));
    if (nn.indexOf(L.nganhNghe) < 0) return false;
  }

  // 3. Khoảng diện tích
  if (!isNaN(L.dtMin) || !isNaN(L.dtMax)) {
    const dt = soM2(nx);
    if (dt === null) return false;
    if (!isNaN(L.dtMin) && dt < L.dtMin) return false;
    if (!isNaN(L.dtMax) && dt > L.dtMax) return false;
  }

  // 4. Các ô danh sách chọn
  for (let i = 0; i < O_LOC_CHON.length; i++) {
    const c = O_LOC_CHON[i];
    if (c.id === boQuaId) continue;
    const v = L.chon[c.id];
    if (v && c.lay(nx) !== v) return false;
  }

  return true;
}


/* ---------- Dựng lại TẤT CẢ danh sách chọn theo thời gian thực ---------- */
function capNhatOChon(L) {
  O_LOC_CHON.forEach(function (c) {
    const sel = document.getElementById(c.id);
    if (!sel) return;

    const dangChon = L.chon[c.id] || '';
    const dem = {};

    (DU_LIEU.nhaXuong || []).forEach(function (nx) {
      if (!khopBoLoc(nx, L, c.id)) return;
      const v = c.lay(nx);
      if (v) dem[v] = (dem[v] || 0) + 1;
    });

    const ds = Object.keys(dem).sort(function (a, b) {
      return a.localeCompare(b, 'vi');
    });

    let html = '<option value="">' + c.nhanTatCa + '</option>';
    ds.forEach(function (v) {
      const ten = c.hien ? c.hien(v) : v;
      html += '<option value="' + _escHTML(v) + '">'
            + _escHTML(ten) + ' (' + dem[v] + ')</option>';
    });

    // Giữ lại lựa chọn hiện hành dù không còn kết quả
    if (dangChon && ds.indexOf(dangChon) < 0) {
      const ten = c.hien ? c.hien(dangChon) : dangChon;
      html += '<option value="' + _escHTML(dangChon) + '">'
            + _escHTML(ten) + ' (0 kết quả)</option>';
    }

    sel.innerHTML = html;
    sel.value = dangChon;   // gán .value không kích hoạt sự kiện change
  });
}

  /* File Excel LUÔN xuất đủ cột của loại hình đang lọc,

  const cotDinhDanh = [
    ['Mã',            function (nx) { return nx.MaDonVi || ''; }],

    ['Loại hình',     function (nx) { return nx.LoaiHinh || ''; }],

  ];

  if (!COT_RIENG_DAY_DU.length) {

  }

  const duLieu = sapXepKetQua_(KET_QUA_LOC).map(function (nx) {   // ★ V5.2: giữ thứ tự đang xếp
    return cot.map(function (c) { return String(c[1](nx) || ''); });
  });
  const bang = [tieuDe].concat(duLieu);

  const nut = document.getElementById('nutXuatExcel');
  const chuGoc = nut.textContent;

  nut.textContent = '⏳ Đang tạo file…';
  function xong() { nut.disabled = false; nut.textContent = chuGoc; }

  // ★ V5.2 — server kiểm tra quyền + ghi nhật ký; file tạo ngay trên trình duyệt
  google.script.run
    .withSuccessHandler(function () {
      taiThuVienExcel_(function () {
        try { taiFileExcel_(bang); }
        catch (e) { taiFileCsv_(bang); }
        xong();
      }, function () {
        taiFileCsv_(bang);
        xong();
      });
    })
    .withFailureHandler(function (loi) {
      xong();

    .ghiNhanXuatExcel(duLieu.length, { token: PHIEN_SUA.token });
}

/***********************************************************************
 * ★ V5.2 — TẠO FILE EXCEL TRÊN TRÌNH DUYỆT
 *  Thư viện chỉ tải khi bấm nút. Không tải được thì xuất CSV thay thế.
 ***********************************************************************/
const URL_THU_VIEN_EXCEL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

function taiThuVienExcel_(xong, loi) {
  if (window.XLSX) { xong(); return; }
  const s = document.createElement('script');
  s.src = URL_THU_VIEN_EXCEL;
  s.onload = xong;
  s.onerror = loi;
  document.head.appendChild(s);
}

function tenFileXuat_(duoi) {
  const d = new Date();
  const so = function (n) { return String(n).padStart(2, '0'); };
  return 'TraCuu_KCN_' + d.getFullYear() + so(d.getMonth() + 1) + so(d.getDate())
       + '_' + so(d.getHours()) + so(d.getMinutes()) + so(d.getSeconds()) + '.' + duoi;
}

function taiFileExcel_(bang) {
  const ws = XLSX.utils.aoa_to_sheet(bang);
  ws['!cols'] = bang[0].map(function (t, i) {
    const dai = bang.slice(0, 200).reduce(function (m, d) {
      return Math.max(m, Math.min(String(d[i] || '').length, 45));
    }, String(t).length);
    return { wch: dai + 2 };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'KetQuaLoc');
  XLSX.writeFile(wb, tenFileXuat_('xlsx'));
}

function taiFileCsv_(bang) {
  const csv = bang.map(function (d) {
    return d.map(function (o) { return '"' + String(o).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = tenFileXuat_('csv');
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
}

/***********************************************************************
 * PANEL CHI TIẾT (DÙNG CHUNG CHO CẢ 2 TAB)
 ***********************************************************************/
function timNhaXuong(ma) {
  return (DU_LIEU.nhaXuong || []).filter(function (n) {
    return String(n.MaDonVi).trim() === String(ma).trim();
  })[0];
}

/***********************************************************************
 * HAI HÀM ĐỌC "CHỊU LỖI" CHO 2 TRƯỜNG HAY BỊ LỆCH CỘT
 *  Sheet có 2 cột khác tên cho cùng một nội dung:
 *    Ngành nghề   : NganhNghe_SanPham (Nhà xưởng) | NganhNghe (Đất)
 *    Thời hạn thuê: ThoiHanThue       (Nhà xưởng) | ThoiHanThue_ChiTiet (Đất)
 ***********************************************************************/
/***********************************************************************
 * ★ V4.7 — LOẠI HÌNH "ĐẤT Ở KDC" (Khu dân cư)
 *  Nhóm đất ở dùng CHUNG bộ cột với "Đất cho thuê" (diện tích đất, đơn giá,
 *  thời hạn…) nên mọi nhánh xử lý cột đất đều gọi qua laLoaiDat().
 *  Khi cần tách riêng số liệu KCN và KDC, dùng laDatOKDC().
 ***********************************************************************/
const LOAI_DAT_CHO_THUE = 'Đất cho thuê';
const LOAI_DAT_O_KDC    = 'Đất ở KDC';

function loaiHinhCua(nx) { return String((nx && nx.LoaiHinh) || '').trim(); }
function laLoaiDat(nx)   { const l = loaiHinhCua(nx); return l === LOAI_DAT_CHO_THUE || l === LOAI_DAT_O_KDC; }
function laDatOKDC(nx)   { return loaiHinhCua(nx) === LOAI_DAT_O_KDC; }

/** Nhãn hiển thị trên chip loại hình */
function nhanLoaiHinh(nx) {
  if (laDatOKDC(nx)) return 'ĐẤT Ở KDC';
  return laLoaiDat(nx) ? 'ĐẤT CHO THUÊ' : 'NHÀ XƯỞNG';
}

function docNganhNghe(nx) {
  if (!nx) return '';
  return laLoaiDat(nx)
    ? (nx.NganhNghe || nx.NganhNghe_SanPham || '')
    : (nx.NganhNghe_SanPham || nx.NganhNghe || '');
}

function docThoiHanThue(nx) {
  if (!nx) return '';
  return laLoaiDat(nx)
    ? (nx.ThoiHanThue_ChiTiet || nx.ThoiHanThue || '')
    : (nx.ThoiHanThue || nx.ThoiHanThue_ChiTiet || '');
}

/**
 * Giá chào thuê tổng hợp, tính từ các cột đơn giá chi tiết.
 */
function giaChaoThue_(nx) {
  if (!nx) return '';
  const laDat = laLoaiDat(nx);

  if (!laDat) {
    // ★ SỬA — bỏ đơn vị cố định "USD/m²/tháng": mỗi khách thuê một đơn vị
    //   khác nhau, cán bộ tự gõ kèm đơn vị ngay trong ô "Đơn giá" khi cần.
    return nx['TienThueXuong - DonGia (USD)'] || '';
  }

  const phan = [];
  if (nx['TienThueMatBang - DonGia (USD)']) {
    // ★ SỬA — bỏ đơn vị cố định "USD/m²/năm": cán bộ tự gõ kèm đơn vị
    //   ngay trong ô "Đơn giá" khi cần (giống Tiền thuê xưởng / Đất thô).
    phan.push('Mặt bằng: ' + nx['TienThueMatBang - DonGia (USD)']);
  }
  if (nx['TienDatTho - DonGia (USD)']) {
    // ★ SỬA — bỏ đơn vị cố định "USD/m²/năm": cán bộ tự gõ kèm đơn vị
    //   ngay trong ô "Đơn giá" khi cần (giống Tiền thuê xưởng ở trên).
    phan.push('Đất thô: ' + nx['TienDatTho - DonGia (USD)']);
  }
  return phan.join(' — ');
}

/** Diện tích đại diện của đơn vị — dùng cho tin nhắn giới thiệu */
function dienTichChinh_(nx) {
  if (!nx) return '';
  return laLoaiDat(nx)
    ? (nx.DienTichDat || nx['Tong DienTichDatThue (m2)'] || '')
    : (nx.DienTichDat || nx.DienTichKhuDat_m2 || '');
}

  document.getElementById('panelTieuDe').textContent =

  let html = '';

  // --- Trạng thái + nhãn Loại hình ---
  const laDatChip = laLoaiDat(nx);
  html += '<div style="margin-bottom:14px">'
        + '<span class="chip" style="background:' + mau + '">'
        + (nx.TrangThai || 'Chưa xác định') + '</span>'
        + '<span class="chip-loai-hinh ' + (laDatOKDC(nx) ? 'kdc' : (laDatChip ? 'dat' : 'nx')) + '">'
        + nhanLoaiHinh(nx) + '</span>'

  // --- THANH THAO TÁC NHANH — luôn nằm đầu panel, không cần cuộn ---
  html += '<div class="thanh-thao-tac">';

  html +=   '<button class="nut nut-nhat" onclick="xemTrongBang(\'' + ma + '\')">📋 Xem trong bảng</button>';
  if (duocPhepSua()) {
    html += '<button class="nut nut-chinh" onclick="moHopThoaiSua(\'' + ma + '\')">✏️ Chỉnh sửa</button>';
  }
  html += '</div>';

  // --- Nút bản đồ ---

    const urlDuong  = 'https://www.google.com/maps/dir/?api=1&destination='
                    + nx.Lat + ',' + nx.Lng;
    const urlDinhVi = 'https://www.google.com/maps/search/?api=1&query='
                    + nx.Lat + ',' + nx.Lng;
    html += '<div class="nhom-nut-ban-do">'
          + '<a href="' + urlDuong + '" target="_blank" rel="noopener" class="nut nut-maps">🚗 Dẫn đường</a>'
          + '<a href="' + urlDinhVi + '" target="_blank" rel="noopener" class="nut nut-nhat">📍 Xem vị trí</a>'
          + '</div>';
  } else {
    html += '<div class="canh-bao">⚠ Đơn vị này chưa có toạ độ Lat/Lng — '
          + 'chưa dùng được chức năng dẫn đường.</div>';

  // --- Thông tin chung (nhận diện vị trí) ---

  html += dongTT('Khu vực / Cụm',    nx.MaCum);

  html += dongTT('DT xây dựng',      dinhDangSo(nx.DienTichXayDung, 'm²'));
  html += dongTT('Đơn giá',          giaChaoThue_(nx));
  html += dongTT('Tình trạng hoạt động', nx.TinhTrangHoatDong);
  html += dongTT('Tiến độ',          nx.TienDo);

  // --- Thông tin nội bộ ---

  // nên khối này không được hiển thị (xemDayDu = false).
  if (NGUOI_DUNG.xemDayDu || duocPhepSua()) {

    const laDatCT = laLoaiDat(nx);

    /* ════════ A — THÔNG TIN DÙNG CHUNG ════════ */

    html += dongTT('Ngành nghề, sản phẩm',  docNganhNghe(nx));
    html += dongTT('Tổng vốn đầu tư',       dinhDangSoTuDo_(nx.TongVonDauTu_USD, 'USD'));   // ★ SỬA — mặc định USD
    html += dongTT('Người đại diện',        nx.NguoiDaiDien);
    html += dongTT('Giấy chứng nhận đầu tư', nx.GiayCNDT);
    html += dongTT('Giấy chứng nhận doanh nghiệp', nx.GiayCNDN);
    html += dongTT('Ngày thành lập',        nx.NgayThanhLap);   // ★ V2.8
    html += dongTT('Cán bộ phụ trách',      tenCanBo(nx.NguoiPhuTrach));
    html += dongTT('Trạng thái rà soát',    nx.TrangThaiRaSoat);
    html += dongTT('Tặng hoa kỷ niệm',      nx.TangHoa);
    html += dongTT('Ghi chú tặng hoa',      nx.GhiChuTangHoa);
    html += '<div class="tieu-de-nhom">A2. Bản thỏa thuận &amp; Hợp đồng <small>(dùng chung)</small></div>';
    html += dongTT('Bản thỏa thuận — Số',        nx['BanThoaThuan - So']);
    html += dongTT('Bản thỏa thuận — Ngày',      nx['BanThoaThuan - Ngay']);
    html += dongTT('Bản thỏa thuận — Hết hạn',   nx['BanThoaThuan - NgayHetHan']);
    html += dongTT('Hợp đồng — Số',              nx.SoHopDong);
    html += dongTT('Hợp đồng — Ngày',            nx.NgayHopDong);

      html += dongTT('DT khu đất',           dinhDangSo(nx.DienTichKhuDat_m2, 'm²'));
      html += dongTT('Tiền thuê xưởng',      ghepGiaPT(nx['TienThueXuong - DonGia (USD)'],
                                                       nx['TienThueXuong - PTThanhToan']));
    }

    /* ════════ C — CHỈ ĐẤT CHO THUÊ ════════ */

      html += '<div class="tieu-de-nhom">C. Chi tiết ĐẤT CHO THUÊ</div>';

  const nhomTL = {};

              +     'onclick="panelChonTL(\'' + id + '\', this.checked)">'
              +   '<a href="' + tl.link + '" target="_blank" rel="noopener" '
              +     'onclick="event.stopPropagation()" style="flex:1">📄 ' + tl.ten + '</a>'
              + '</label>';

        html += '<a href="' + tl.link + '" target="_blank" rel="noopener" class="muc-tai-lieu">'
              + '📄 ' + tl.ten + '</a>';
      }

    html += '</div>';
  });
  if (chonDuocTL) {
    html += '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">'
          + '<span id="panelSoLuongChonTL" style="font-size:12px;color:#64748b">0 tệp đã chọn</span>'
          + '<button class="nut nut-nhat" id="panelNutGoiTL" disabled '
          +   'style="margin-left:auto" onclick="panelTaoGoiChonLoc()">'
          + '📋 Sao chép tin nhắn gửi KH</button>'
          + '</div>';
  }
  // ★ V3.3 — nút tải lên / quản lý tài liệu (chỉ hiện với vai trò Quản trị)
  if (duocPhepSua()) {
    html += '<button class="nut nut-nhat" '
          + 'style="width:100%;justify-content:center;margin-top:8px" '
          + 'onclick="moHopThoaiTaiLieu(\'' + ma + '\')">'
          + '📎 Thêm / quản lý tài liệu</button>';
  }
  if (nx.LinkBrochure) {
    html += '<a href="' + nx.LinkBrochure + '" target="_blank" rel="noopener" class="muc-tai-lieu">📘 Brochure</a>';
  }
  if (nx.LinkAnh) {
    html += '<a href="' + nx.LinkAnh + '" target="_blank" rel="noopener" class="muc-tai-lieu">🖼️ Hình ảnh</a>';

  // --- Lặp lại nút chỉnh sửa ở cuối panel cho thao tác liền mạch ---
  if (duocPhepSua()) {
    html += '<button class="nut nut-chinh" style="width:100%;justify-content:center;margin-top:20px" '
          + 'onclick="moHopThoaiSua(\'' + ma + '\')">✏️ Chỉnh sửa thông tin đơn vị này</button>';
  }

  document.getElementById('panelNoiDung').innerHTML = html;

  // ★ V4.4: đưa panel về đầu nội dung trước khi trượt ra (tránh giữ vị trí
  //          cuộn của đơn vị mở trước đó, do panel nay luôn nằm trong DOM)
  const thanPanel = document.querySelector('#panelChiTiet .panel-than');
  if (thanPanel) thanPanel.scrollTop = 0;

  panelHieuUngMo_();
}

/* ================================================================
   ★ V4.6 — HIỆU ỨNG MỞ/ĐÓNG PANEL CHI TIẾT BẰNG MOTION
   - Chỉ dùng transform (x, y) + opacity → GPU xử lý, không reflow.
   - Lò xo không nảy (bounce 0) cho phong cách nghiêm túc.
   - Mở lại trong lúc đang đóng: tiếp tục mượt từ vị trí hiện tại.
   - Không có Motion / người dùng bật "giảm chuyển động" → dùng CSS cũ.
================================================================ */
let PANEL_PHIEN_HIEU_UNG = 0;   // số phiên, chặn callback đóng cũ khi đã mở lại

function panelCoMotion_() {
  return !!(window.Motion && Motion.animate &&
            document.documentElement.classList.contains('dung-motion') &&
            !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches));
}

function panelHieuUngMo_() {
  const pn = document.getElementById('panelChiTiet');
  const lp = document.getElementById('lopPhu');
  const tuTrangThaiAn = pn.classList.contains('an');
  const dangDong = pn.dataset.dangDong === '1';

  PANEL_PHIEN_HIEU_UNG++;
  pn.dataset.dangDong = '';
  pn.style.pointerEvents = '';
  lp.style.pointerEvents = '';
  pn.classList.remove('an');
  lp.classList.remove('an');

  if (!panelCoMotion_()) return;
  const animate = Motion.animate, stagger = Motion.stagger;

  // Từ trạng thái ẩn: đặt điểm xuất phát; đang đóng dở: chạy tiếp từ vị trí hiện tại
  const batDauMoi = tuTrangThaiAn && !dangDong;
  animate(pn,
    { x: batDauMoi ? ['104%', '0%'] : '0%', opacity: batDauMoi ? [0, 1] : 1 },
    { type: 'spring', bounce: 0, visualDuration: 0.32 });
  animate(lp, { opacity: batDauMoi ? [0, 1] : 1 }, { duration: 0.25, ease: 'easeOut' });

  // Nội dung hiện lần lượt (chỉ 10 khối đầu để nhẹ máy)
  const than = document.getElementById('panelNoiDung');
  const khoi = than ? Array.prototype.slice.call(than.children, 0, 10) : [];
  if (khoi.length) {
    animate(khoi, { opacity: [0, 1], y: [10, 0] },
      { duration: 0.26, ease: 'easeOut', delay: stagger(0.035, { startDelay: tuTrangThaiAn ? 0.08 : 0 }) });
  }
}

/** Mở/đóng 1 nhóm loại tài liệu trong panel chi tiết (chỉ đổi hiển thị, không gọi server) */
function panelBatMoNhomTL(idThan, dongTieuDe) {
  const than = document.getElementById(idThan);
  if (!than) return;
  const dangMo = than.style.display !== 'none';
  than.style.display = dangMo ? 'none' : 'block';
  dongTieuDe.textContent = dongTieuDe.textContent.replace(
    dangMo ? '▾' : '▸', dangMo ? '▸' : '▾');
}

/** Tick/bỏ tick 1 tệp trong panel chi tiết */
function panelChonTL(fileId, checked) {
  if (checked) PANEL_TL_CHON.add(fileId);
  else PANEL_TL_CHON.delete(fileId);
  panelCapNhatSoLuongChonTL();
}

function panelChonTatCaTL() {
  const nx = timNhaXuong(MA_DANG_MO);
  const ds = (nx && nx.DanhSachTaiLieu) ? nx.DanhSachTaiLieu : [];
  PANEL_TL_CHON = new Set();
  ds.forEach(function (tl) {
    const id = tlLayId ? tlLayId(tl.link) : '';
    if (id) PANEL_TL_CHON.add(id);
  });
  document.querySelectorAll('#panelNoiDung input[type="checkbox"]').forEach(function (cb) {
    cb.checked = true;
  });
  panelCapNhatSoLuongChonTL();
}

  PANEL_TL_CHON = new Set();

/** Soạn tin nhắn liệt kê các tệp đã tick trong panel chi tiết (tên + link
 *  xem trực tiếp từng tệp) rồi sao chép để dán gửi khách qua Zalo.
 *  ★ KHÔNG nén ZIP — các tệp đã có sẵn link xem/tải riêng (đã setSharing
 *  khi tải lên), khách mở trực tiếp trên điện thoại, không cần giải nén. */
function panelTaoGoiChonLoc() {
  if (PANEL_TL_CHON.size === 0) return;
  const nx = timNhaXuong(MA_DANG_MO);
  if (!nx) return;

  const dsChon = (nx.DanhSachTaiLieu || []).filter(function (tl) {
    return PANEL_TL_CHON.has(tlLayId(tl.link));
  });
  if (dsChon.length === 0) return;

  const tin = '📎 TÀI LIỆU — ' + (nx.TenNhaXuong || MA_DANG_MO) + ' (Sonadezi Long Thành)\n'
            + '────────────────────\n'
            + dsChon.map(function (t) { return '• ' + t.ten + ':\n' + t.link; }).join('\n')
            + '\n────────────────────';

  const baoXong = function () {
    alert('✓ Đã sao chép tin nhắn (' + dsChon.length + ' tệp) — dán để gửi khách hàng qua Zalo.');
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tin).then(baoXong).catch(function () {
      window.prompt('Sao chép tin nhắn gửi khách hàng:', tin);
    });
  } else {
    window.prompt('Sao chép tin nhắn gửi khách hàng:', tin);
  }
}

function dongPanel() {
  const pn = document.getElementById('panelChiTiet');
  const lp = document.getElementById('lopPhu');
  boHighlight();

  // ★ V4.6 — không có Motion: giữ cơ chế CSS cũ
  if (!panelCoMotion_() || pn.classList.contains('an')) {
    pn.classList.add('an');
    lp.classList.add('an');
    return;
  }
  if (pn.dataset.dangDong === '1') return;   // đang đóng rồi, bỏ qua bấm lặp

  const phien = ++PANEL_PHIEN_HIEU_UNG;
  pn.dataset.dangDong = '1';
  pn.style.pointerEvents = 'none';           // nhả thao tác bản đồ ngay khi bấm đóng
  lp.style.pointerEvents = 'none';

  Promise.all([
    Motion.animate(pn, { x: '104%', opacity: 0 }, { duration: 0.22, ease: 'easeIn' }),
    Motion.animate(lp, { opacity: 0 }, { duration: 0.2, ease: 'easeIn' })
  ]).then(function () {
    if (phien !== PANEL_PHIEN_HIEU_UNG) return;   // đã mở lại giữa chừng
    pn.dataset.dangDong = '';
    pn.style.pointerEvents = '';
    lp.style.pointerEvents = '';
    pn.classList.add('an');
    lp.classList.add('an');
  });
}
/** Đổ danh sách cán bộ vào dropdown "Cán bộ phụ trách" rồi chọn giá trị hiện tại.
 *  Nguồn: DU_LIEU.danhSachCanBo (server gửi kèm cho tài khoản biên tập). */
function napChonCanBo(emailHienTai) {
  const sel = _o('suaNguoiPhuTrach');
  if (!sel) return;
  const ds = (DU_LIEU && DU_LIEU.danhSachCanBo) ? DU_LIEU.danhSachCanBo : [];
  let html = '<option value="">— Chưa phân công —</option>';
  ds.forEach(function (cb) {
    html += '<option value="' + _escHTML(cb.email) + '">'
          + _escHTML(cb.hoTen) + '</option>';
  });
  // Cán bộ cũ nay đã khoá/xoá khỏi danh sách → vẫn giữ lại để không mất dữ liệu.
  const email = String(emailHienTai || '').trim();
  const conTrongDs = ds.some(function (cb) { return cb.email === email; });
  if (email && !conTrongDs) {
    html += '<option value="' + _escHTML(email) + '">'
          + _escHTML(email) + ' (ngoài danh sách)</option>';
  }
  sel.innerHTML = html;
  sel.value = email;
}

/** Đổi email cán bộ → "Họ tên (email)" để hiển thị; không tìm được thì giữ email. */
function tenCanBo(email) {
  email = String(email || '').trim();
  if (!email) return '';
  const ds = (DU_LIEU && DU_LIEU.danhSachCanBo) ? DU_LIEU.danhSachCanBo : [];
  for (let i = 0; i < ds.length; i++) {
    if (ds[i].email === email) return _escHTML(ds[i].hoTen) + ' (' + _escHTML(email) + ')';
  }
  return _escHTML(email);
}

function dinhDangSo(v, donVi) {
  if (!v && v !== 0) return '';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toLocaleString('vi-VN') + ' ' + (donVi || '');
}

/**
 * ★ MỚI — hiển thị số KHÔNG ép đơn vị cố định (dùng cho Tổng vốn đầu tư,
 * vì mỗi nhà đầu tư 1 loại tiền: USD/EUR/VNĐ...).
 * - Luôn tự thêm dấu CHẤM phân cách hàng nghìn cho PHẦN SỐ ở đầu chuỗi,
 *   dù cán bộ có gõ kèm đơn vị phía sau hay không.
 *   VD: "40000000"        -> "40.000.000"
 *       "40000000 USD"    -> "40.000.000 USD"
 *       "40.000.000 EUR"  -> "40.000.000 EUR"   (đã có dấu chấm vẫn nhận đúng)
 * - Nếu chuỗi không bắt đầu bằng số (hiếm) → hiển thị nguyên văn, không đoán.
 */
function dinhDangSoTuDo_(v, donViMacDinh) {   // ★ SỬA — thêm tham số đơn vị mặc định
  if (v === null || v === undefined || v === '') return '';
  const s = String(v).trim();

  const m = s.match(/^-?[\d.]+/);          // phần số (có thể lẫn dấu chấm) ở đầu chuỗi
  if (!m) return s;

  let soThuan   = m[0].replace(/\.$/, ''); // bỏ dấu chấm gõ dư ở cuối (nếu có)
  const phanSau = s.slice(m[0].length).trim();

  const soLanCham = (soThuan.match(/\./g) || []).length;
  if (soLanCham > 1) {
    soThuan = soThuan.replace(/\./g, '');                    // nhiều dấu chấm → chắc chắn là phân cách nghìn
  } else if (soLanCham === 1 && soThuan.split('.')[1].length === 3) {
    soThuan = soThuan.replace('.', '');                      // 1 dấu chấm + đúng 3 số sau → cũng là phân cách nghìn
  }

  const n = Number(soThuan);
  if (isNaN(n)) return s;

  const daDinhDang = n.toLocaleString('vi-VN');
  // ★ SỬA — nếu cán bộ chỉ gõ con số (không kèm đơn vị) thì gắn đơn vị mặc định.
  //         Nếu đã gõ sẵn đơn vị (Euro, VNĐ, JPY...) thì giữ nguyên, không ghi đè.
  if (phanSau) return daDinhDang + ' ' + phanSau;
  return donViMacDinh ? daDinhDang + ' ' + donViMacDinh : daDinhDang;
}

/** Gộp Đơn giá + PT thanh toán thành 1 dòng hiển thị */
function ghepGiaPT(donGia, pt, donVi) {
  donGia = (donGia === null || donGia === undefined) ? '' : String(donGia).trim();
  pt     = (pt     === null || pt     === undefined) ? '' : String(pt).trim();
  if (donGia && donVi) donGia = donGia + ' ' + donVi;
  if (donGia && pt)  return donGia + ' — ' + pt;
  if (donGia)        return donGia;
  if (pt)            return pt;
  return '';
}

               ? ' selected' : '';

      '<option value="' + t.TenTrangThai + '"' + chon + '>' + t.TenTrangThai + '</option>');

  /* ════════ PHẦN C — CHỈ GHI KHI LÀ ĐẤT CHO THUÊ ════════ */
  if (laDat) {
    _layO(duLieuMoi, 'LoDatThue',                      'suaLoDatThue');
    _layO(duLieuMoi, 'Tong DienTichDatThue (m2)',      'suaTongDienTichDat');
    _layO(duLieuMoi, 'DienTichDatThueThem (m2)',       'suaDienTichThueThem');
    _layO(duLieuMoi, 'TienThueMatBang - DonGia (USD)', 'suaDonGiaThueMB');
    _layO(duLieuMoi, 'TienThueMatBang - PTThanhToan',  'suaPTThanhToanMB');
    _layO(duLieuMoi, 'TienDatTho - DonGia (USD)',      'suaDonGiaDatTho');
    _layO(duLieuMoi, 'TienDatTho - PTThanhToan',       'suaPTThanhToanDatTho');
  }

  // ★ SỬA — bỏ chặn nút Lưu: chỉ cần gác ngay tại ô chọn "Đã rà soát"
  //   (đã disable option khi mở form — xem moHopThoaiSua/_cvGacRaSoat)
  //   là đủ; các trường khác trong form vẫn lưu bình thường không bị chặn.

  nut.disabled = true;
  nut.textContent = 'Đang lưu…';
  tb.className = 'thong-bao';
  tb.textContent = '';

  google.script.run
    .withSuccessHandler(function (kq) {
      // Cập nhật dữ liệu trong bộ nhớ để không phải tải lại
      const nx = timNhaXuong(ma);
      if (nx) {
        Object.keys(duLieuMoi).forEach(function (k) { nx[k] = duLieuMoi[k]; });
        // ★ V4.0 — cập nhật ngay vết truy xuất để panel hiển thị đúng
        if (kq && kq.nguoiCapNhat) nx.NguoiCapNhat = kq.nguoiCapNhat;
        nx.ThoiGianCapNhat = new Date().toLocaleString('vi-VN');
      }

      nut.disabled = false;
      nut.textContent = '💾 Lưu';

      // Cảnh báo nếu có tên cột không khớp tiêu đề Sheet
      const thieu = (kq && kq.cotKhongTonTai) || [];
      if (thieu.length > 0) {
        tb.className = 'thong-bao loi';
        tb.textContent = '⚠ Đã lưu, nhưng KHÔNG tìm thấy cột: '
          + thieu.join(', ')
          + '. Vui lòng báo quản trị kiểm tra tiêu đề sheet DS_NhaXuong.';
        return;   // giữ hộp thoại mở để người dùng đọc cảnh báo
      }

      tb.className = 'thong-bao ok';
      tb.textContent = '✓ Đã lưu thành công ('
        + ((kq && kq.soTruongDaSua) || 0) + ' ô thay đổi).';
      setTimeout(function () {
        dongHopThoaiSua();
        moPanelChiTiet(ma);
      }, 700);
    })
    .withFailureHandler(function (e) {
      nut.disabled = false;
      nut.textContent = '💾 Lưu';
      tb.className = 'thong-bao loi';
      tb.textContent = '✕ Lỗi: ' + e.message;
    })
    .capNhatNhaXuong(ma, duLieuMoi, { token: PHIEN_SUA.token });
}
